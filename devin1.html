<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BGSN Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Oswald:wght@700&family=Anton&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --chrome-hi: rgba(255,255,255,0.75);
    --chrome-mid: rgba(180,190,210,0.4);
    --chrome-lo: rgba(40,44,60,0.9);
    --chrome-edge: rgba(200,210,230,0.5);
    --gold: #c8a84b;
    --gold-glow: rgba(200,168,75,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
  }

  /* ─── SCOREBOARD WRAPPER ─── */
  .scoreboard {
    position: absolute; bottom: 96px;
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: stretch;
    filter: drop-shadow(0 4px 30px rgba(0,0,0,0.9))
            drop-shadow(0 0 50px rgba(0,180,255,0.08));
    height: 52px;
  }

  /* ─── TEAM BLOCKS ─── */
  .team-block {
    display: flex; align-items: stretch; position: relative; gap: 0; margin: 0;
  }

  /* ─── TEAM NAME PILL ─── */
  .team-name-pill {
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 36px; letter-spacing: 4px;
    padding: 0 24px;
    height: 52px;
    width: 380px; min-width: 380px; max-width: 380px;
    display: flex; align-items: center;
    text-transform: uppercase;
    position: relative; z-index: 1;
    overflow: hidden;
    line-height: 1;
    border: none;
  }

  /* Away team name - team color fades in from right (score side) */
  .team-block.away .team-name-pill {
    justify-content: flex-end; padding-right: 22px;
    background: linear-gradient(90deg, #0a0a18 0%, #12101e 15%, #2a1018 35%, #5c1515 55%, #8a1212 75%, #c41a1a 100%);
    clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%);
  }
  /* Home team name - team color fades in from left (score side) */
  .team-block.home .team-name-pill {
    justify-content: flex-start; padding-left: 22px;
    background: linear-gradient(90deg, #1a6fc4 0%, #143d6e 25%, #0e2040 45%, #0c1428 65%, #10101e 80%, #0a0a18 100%);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
  }

  /* Brushed metal texture + chrome gloss on name pills */
  .team-name-pill::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      repeating-linear-gradient(
        90deg,
        transparent, transparent 1px,
        rgba(255,255,255,0.02) 1px, rgba(255,255,255,0.02) 2px
      ),
      linear-gradient(180deg,
        rgba(255,255,255,0.18) 0%,
        rgba(255,255,255,0.06) 15%,
        transparent 45%,
        rgba(0,0,0,0.1) 70%,
        rgba(0,0,0,0.3) 100%
      );
    pointer-events: none; z-index: 3;
  }

  /* Chrome outline wrapper for name pills - uses an inner element */
  .team-name-inner {
    position: relative; z-index: 4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  /* Glowing team-colored edge accent + chrome highlight line on name pills */
  .team-block.away .team-name-pill::after {
    content: ''; position: absolute;
    bottom: 0; left: 12px; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--away-accent, #ff3333) 30%, var(--away-accent, #ff3333) 70%, transparent);
    box-shadow: 0 0 10px var(--away-accent, #ff3333), 0 0 25px var(--away-accent, rgba(255,51,51,0.4));
    pointer-events: none; z-index: 5;
  }
  .team-block.home .team-name-pill::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 12px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--home-accent, #3399ff) 30%, var(--home-accent, #3399ff) 70%, transparent);
    box-shadow: 0 0 10px var(--home-accent, #3399ff), 0 0 25px var(--home-accent, rgba(51,153,255,0.4));
    pointer-events: none; z-index: 5;
  }

  /* Chrome top highlight on name pills */
  .chrome-top-line {
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--chrome-hi) 30%, var(--chrome-hi) 70%, transparent);
    z-index: 6; pointer-events: none;
  }

  /* ─── SCORE BOXES ─── */
  .score-box {
    width: 105px; height: 52px; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    position: relative;
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 38px; color: #fff; z-index: 2;
    letter-spacing: 1px; border: none; margin: 0;
  }
  .score-box span {
    position: relative; z-index: 4;
    text-shadow: 0 0 12px rgba(255,255,255,0.35), 0 2px 4px rgba(0,0,0,0.6);
  }

  /* Home score box */
  .team-block.home .score-box {
    background: linear-gradient(180deg, #1a6fc4 0%, #0d3d6e 60%, #0a2a4d 100%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  }
  /* Away score box */
  .team-block.away .score-box {
    background: linear-gradient(180deg, #c41a1a 0%, #6e0d0d 60%, #4d0a0a 100%);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 6px 100%);
  }

  /* Chrome gloss on score boxes */
  .score-box::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.35) 0%,
      rgba(255,255,255,0.12) 30%,
      rgba(255,255,255,0.03) 60%,
      transparent 100%
    );
    pointer-events: none; z-index: 3;
  }
  /* Vertical chrome edge highlights on score boxes */
  .team-block.home .score-box::after {
    content: ''; position: absolute;
    top: 0; left: 0; width: 2px; height: 100%;
    background: linear-gradient(180deg, var(--chrome-hi), rgba(255,255,255,0.15), transparent);
    box-shadow: 0 0 6px rgba(255,255,255,0.2);
    pointer-events: none; z-index: 5;
  }
  .team-block.away .score-box::after {
    content: ''; position: absolute;
    top: 0; right: 0; width: 2px; height: 100%;
    background: linear-gradient(180deg, var(--chrome-hi), rgba(255,255,255,0.15), transparent);
    box-shadow: 0 0 6px rgba(255,255,255,0.2);
    pointer-events: none; z-index: 5;
  }

  /* Inner chrome border on score boxes */
  .score-box-chrome {
    position: absolute;
    top: 1px; left: 1px; right: 1px; bottom: 1px;
    border: 1px solid rgba(255,255,255,0.12);
    border-top-color: rgba(255,255,255,0.3);
    border-bottom-color: rgba(0,0,0,0.4);
    pointer-events: none; z-index: 6;
  }

  /* Score bump animation */
  .score-box.bump { animation: scoreBump 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  @keyframes scoreBump {
    0%   { transform: scale(1);    filter: brightness(1); }
    15%  { transform: scale(1.35); filter: brightness(1.8) saturate(1.5); }
    30%  { transform: scale(1.20); filter: brightness(1.4); }
    50%  { transform: scale(1.28); filter: brightness(1.6) saturate(1.3); }
    70%  { transform: scale(1.05); filter: brightness(1.1); }
    100% { transform: scale(1);    filter: brightness(1); }
  }
  .score-box.bump span {
    animation: scoreFlash 0.6s ease;
  }
  @keyframes scoreFlash {
    0%   { text-shadow: none; }
    20%  { text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 40px rgba(255,255,255,0.8); }
    60%  { text-shadow: 0 0 10px rgba(255,255,255,0.5); }
    100% { text-shadow: none; }
  }

  /* ─── TIMEOUT DOTS ─── */
  .timeout-dots {
    display: flex; gap: 5px; align-items: center;
    justify-content: center;
    position: absolute;
    bottom: 2px;
    left: 50%; transform: translateX(-50%);
    z-index: 20;
  }
  .timeout-dot {
    width: 18px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 8px rgba(255,255,255,0.2);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .timeout-dot.used {
    background: rgba(255,255,255,0.12);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* ─── CENTER BLOCK ─── */
  .center-block {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, #131320 0%, #08080e 50%, #0c0c14 100%);
    width: 180px; height: 52px;
    position: relative; z-index: 3; gap: 1px; overflow: hidden;
    /* Chrome metallic borders */
    border-left: 2px solid;
    border-right: 2px solid;
    border-image: linear-gradient(180deg, var(--chrome-hi), var(--chrome-mid), rgba(0,0,0,0.5)) 1;
  }
  /* Chrome gloss on center block */
  .center-block::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 45%;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.10) 0%,
      rgba(255,255,255,0.03) 60%,
      transparent 100%
    );
    pointer-events: none; z-index: 2;
  }
  /* Animated scanning line */
  .center-block::after {
    content: ''; position: absolute;
    top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(200,168,75,0.1), transparent);
    animation: scanLine 4s ease-in-out infinite;
    pointer-events: none; z-index: 2;
  }
  @keyframes scanLine {
    0%   { left: -60%; }
    50%  { left: 100%; }
    100% { left: -60%; }
  }
  /* Gold accent lines on center block top and bottom */
  .center-chrome-top, .center-chrome-bot {
    position: absolute; left: 0; right: 0; height: 1px; z-index: 6; pointer-events: none;
  }
  .center-chrome-top {
    top: 0;
    background: linear-gradient(90deg, var(--gold), rgba(255,255,255,0.6), var(--gold));
    box-shadow: 0 0 8px var(--gold-glow);
  }
  .center-chrome-bot {
    bottom: 0;
    background: linear-gradient(90deg, rgba(200,168,75,0.4), rgba(255,255,255,0.2), rgba(200,168,75,0.4));
    box-shadow: 0 0 6px rgba(200,168,75,0.2);
  }

  /* ─── OUTER CHROME ENDCAPS ─── */
  .endcap {
    width: 36px; height: 52px; position: relative; z-index: 4;
    overflow: hidden;
  }
  .endcap.left {
    background: linear-gradient(180deg, #4a4a5e 0%, #2a2a3e 30%, #1a1a28 60%, #0e0e18 100%);
    clip-path: polygon(100% 0, 100% 100%, 35% 100%, 0 70%, 0 30%, 35% 0);
  }
  .endcap.right {
    background: linear-gradient(180deg, #4a4a5e 0%, #2a2a3e 30%, #1a1a28 60%, #0e0e18 100%);
    clip-path: polygon(0 0, 65% 0, 100% 30%, 100% 70%, 65% 100%, 0 100%);
  }
  /* Metallic sheen + brushed texture on endcaps */
  .endcap::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.08), transparent);
    pointer-events: none;
  }
  .endcap::after {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      repeating-linear-gradient(
        0deg,
        transparent, transparent 2px,
        rgba(255,255,255,0.04) 2px, rgba(255,255,255,0.04) 4px
      ),
      repeating-linear-gradient(
        90deg,
        transparent, transparent 3px,
        rgba(255,255,255,0.02) 3px, rgba(255,255,255,0.02) 4px
      );
    pointer-events: none;
  }
  /* Chrome outline glow on endcaps */
  .endcap-outline {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 5;
  }
  .endcap.left .endcap-outline {
    border-right: 1px solid rgba(255,255,255,0.25);
    box-shadow: inset -2px 0 6px rgba(255,255,255,0.08);
  }
  .endcap.right .endcap-outline {
    border-left: 1px solid rgba(255,255,255,0.25);
    box-shadow: inset 2px 0 6px rgba(255,255,255,0.08);
  }

  /* ─── CHROME DIVIDER BARS between sections ─── */
  .chrome-divider {
    width: 3px; height: 52px; position: relative; z-index: 10;
    background: linear-gradient(180deg,
      var(--chrome-hi) 0%,
      var(--chrome-mid) 20%,
      rgba(120,130,150,0.3) 50%,
      var(--chrome-mid) 80%,
      var(--chrome-hi) 100%
    );
    box-shadow: 0 0 8px rgba(255,255,255,0.15), 0 0 3px rgba(255,255,255,0.3);
  }



  /* Top chrome accent line across entire scoreboard */
  .scoreboard::after {
    content: ''; position: absolute;
    top: -1px; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(180,190,210,0.3) 5%,
      var(--chrome-hi) 15%,
      rgba(255,255,255,0.9) 30%,
      var(--gold) 50%,
      rgba(255,255,255,0.9) 70%,
      var(--chrome-hi) 85%,
      rgba(180,190,210,0.3) 95%,
      transparent 100%
    );
    box-shadow: 0 0 10px var(--gold-glow), 0 -2px 8px rgba(255,255,255,0.15);
    pointer-events: none; z-index: 50;
  }

  /* Bottom chrome line on scoreboard */
  .scoreboard-bottom-chrome {
    position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; z-index: 50;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(100,110,130,0.3) 10%,
      rgba(150,160,180,0.5) 30%,
      rgba(200,168,75,0.6) 50%,
      rgba(150,160,180,0.5) 70%,
      rgba(100,110,130,0.3) 90%,
      transparent 100%
    );
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    pointer-events: none;
  }

  /* ─── INFO BAR (DOWN & DISTANCE) ─── */
  .info-bar {
    position: absolute; bottom: 156px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    white-space: nowrap;
  }
  .info-pill {
    background: rgba(10,10,10,0.92); border: 1px solid #2a2a2a; color: #ccc;
    font-weight: 700; font-size: 15px; letter-spacing: 2px;
    padding: 5px 18px; text-transform: uppercase;
  }
  .info-pill.down {
    border-radius: 6px;
    font-size: 32px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    padding: 2px 28px;
    line-height: 1;
    background: linear-gradient(180deg, #1a1a2e 0%, #0a0a14 100%);
    /* Chrome metallic border */
    border: 1px solid rgba(180,190,210,0.35);
    border-top-color: rgba(255,255,255,0.5);
    border-bottom-color: rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
    transition: opacity 0.3s, max-height 0.3s;
    box-shadow: 0 0 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .info-pill.down::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), transparent);
    pointer-events: none;
  }
  .info-pill.down::after {
    content: ''; position: absolute;
    bottom: -1px; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-glow), transparent);
    pointer-events: none;
  }
  .info-pill.down.hidden {
    opacity: 0; pointer-events: none; max-height: 0; padding: 0; overflow: hidden; border: none;
  }

  /* ─── PENALTY FLAG ─── */
  .penalty-flag {
    position: absolute;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #ffe44d 0%, #f0c040 50%, #d4a020 100%);
    color: #111;
    font-family: 'Orbitron', sans-serif;
    font-size: 34px; letter-spacing: 8px; font-weight: 900;
    width: 180px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%);
    box-shadow: 0 0 20px #f0c040, 0 0 40px rgba(240,192,64,0.6);
    filter: drop-shadow(0 0 12px rgba(240,192,64,0.9));
    transition: opacity 0.4s;
    z-index: 10;
    white-space: nowrap;
  }
  .penalty-flag.hidden { opacity: 0; pointer-events: none; }



  .flag-glow {
    position: absolute;
    bottom: 148px;
    left: 50%; transform: translateX(-50%);
    width: 1200px;
    height: 180px;
    background: radial-gradient(ellipse 50% 100% at 50% 100%, rgba(240,192,64,0.45) 0%, rgba(240,192,64,0.15) 40%, transparent 80%);
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .flag-glow.visible {
    opacity: 1;
    animation: glowBreathe 2.8s ease-in-out infinite;
  }
  @keyframes glowBreathe {
    0%   { opacity: 0.6; transform: translateX(-50%) scaleY(1) scaleX(1); }
    40%  { opacity: 1.0; transform: translateX(-50%) scaleY(1.12) scaleX(1.04); }
    70%  { opacity: 0.75; transform: translateX(-50%) scaleY(0.95) scaleX(1.01); }
    100% { opacity: 0.6; transform: translateX(-50%) scaleY(1) scaleX(1); }
  }
  /* ─── PENALTY ACTIVE: yellow outline on entire scoreboard ─── */
  .scoreboard.penalty-active::after {
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(240,192,64,0.5) 5%,
      #ffe44d 15%,
      #ffd960 30%,
      #ffe44d 50%,
      #ffd960 70%,
      #ffe44d 85%,
      rgba(240,192,64,0.5) 95%,
      transparent 100%
    ) !important;
    height: 2px !important;
    box-shadow: 0 0 12px rgba(255,228,77,0.6), 0 -3px 15px rgba(255,228,77,0.3) !important;
  }
  .scoreboard.penalty-active .scoreboard-bottom-chrome {
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(240,192,64,0.5) 5%,
      #ffe44d 15%,
      #ffd960 30%,
      #ffe44d 50%,
      #ffd960 70%,
      #ffe44d 85%,
      rgba(240,192,64,0.5) 95%,
      transparent 100%
    ) !important;
    height: 2px !important;
    box-shadow: 0 3px 12px rgba(255,228,77,0.4) !important;
  }
  .scoreboard.penalty-active .chrome-divider {
    background: linear-gradient(180deg,
      #ffe44d 0%, #ffd960 20%, rgba(240,192,64,0.5) 50%, #ffd960 80%, #ffe44d 100%
    ) !important;
    box-shadow: 0 0 8px rgba(255,228,77,0.4) !important;
  }
  .scoreboard.penalty-active .center-block {
    border-image: linear-gradient(180deg, #ffe44d, rgba(240,192,64,0.6), #ffe44d) 1 !important;
  }
  .scoreboard.penalty-active .center-chrome-top,
  .scoreboard.penalty-active .center-chrome-bot {
    background: linear-gradient(90deg, #ffe44d, #ffd960, #ffe44d) !important;
    box-shadow: 0 0 10px rgba(255,228,77,0.5) !important;
  }
  .scoreboard.penalty-active .endcap.left .endcap-outline {
    border-right-color: rgba(255,228,77,0.5) !important;
    box-shadow: inset -2px 0 8px rgba(255,228,77,0.15) !important;
  }
  .scoreboard.penalty-active .endcap.right .endcap-outline {
    border-left-color: rgba(255,228,77,0.5) !important;
    box-shadow: inset 2px 0 8px rgba(255,228,77,0.15) !important;
  }
  .scoreboard.penalty-active .score-box-chrome {
    border-color: rgba(255,228,77,0.25) !important;
    border-top-color: rgba(255,228,77,0.5) !important;
  }

  /* ─── TICKER ─── */
  .ticker {
    position: absolute; bottom: 0; left: 0; right: 0; height: 46px;
    background: linear-gradient(180deg, #131320 0%, #08080e 100%);
    display: flex; align-items: center; overflow: hidden;
    /* Chrome metallic top border */
    border-top: 2px solid;
    border-image: linear-gradient(90deg, rgba(60,65,80,0.5), var(--chrome-hi), var(--gold), var(--chrome-hi), rgba(60,65,80,0.5)) 1;
    box-shadow: inset 0 2px 8px rgba(255,255,255,0.04);
  }
  /* Secondary glow line on ticker top */
  .ticker::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 10%, var(--gold-glow) 50%, transparent 90%);
    box-shadow: 0 0 12px var(--gold-glow);
    pointer-events: none; z-index: 5;
  }
  /* Chrome bottom edge on ticker */
  .ticker::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    pointer-events: none; z-index: 5;
  }
  .ticker-content {
    flex: 1; overflow: hidden; display: flex; align-items: center; height: 100%;
  }
  .ticker-label {
    background: linear-gradient(180deg, #1e1e34 0%, #12121e 50%, #0a0a14 100%);
    color: #ffd960;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 15px; letter-spacing: 4px; padding: 0 22px; height: 100%;
    display: flex; align-items: center; white-space: nowrap;
    flex-shrink: 0;
    /* Chrome metallic right border */
    border-right: 3px solid;
    border-image: linear-gradient(180deg, var(--chrome-hi), var(--gold), rgba(0,0,0,0.5)) 1;
    text-shadow: 0 0 14px rgba(255,217,96,0.6), 0 0 6px rgba(255,217,96,0.3);
    position: relative;
    z-index: 2;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.3);
  }
  /* Brushed metal texture on label */
  .ticker-label::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      repeating-linear-gradient(
        90deg,
        transparent, transparent 2px,
        rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 3px
      ),
      linear-gradient(180deg, rgba(255,255,255,0.08), transparent 40%, rgba(0,0,0,0.2));
    pointer-events: none;
  }
  .ticker-label::after {
    content: ''; position: absolute;
    top: 0; right: -3px; width: 16px; height: 100%;
    background: linear-gradient(180deg, rgba(200,168,75,0.25), transparent 30%, transparent 70%, rgba(200,168,75,0.25));
    pointer-events: none;
  }
  .ticker-scroll {
    display: flex; white-space: nowrap;
  }
  .ticker-item {
    color: #e8e8e8; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 32px; letter-spacing: 1px; padding: 0 30px; line-height: 46px;
  }
  .ticker-item span { color: #f0c040; font-weight: 900; }
  .ticker-sep { color: #ffd960; padding: 0 8px; font-size: 32px; line-height: 46px; text-shadow: 0 0 8px rgba(255,217,96,0.5); }
  @keyframes scroll-left { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

  /* ─── DECORATIVE CIRCUIT LINES ─── */
  .circuit-line {
    position: absolute;
    pointer-events: none;
    z-index: 0;
  }
  .circuit-line.left {
    bottom: 96px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 60px); height: 74px;
  }
  .circuit-line.left::before {
    content: ''; position: absolute;
    bottom: -10px; left: 30px; right: 30px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,180,255,0.12), var(--gold-glow), rgba(255,50,50,0.12), transparent);
    box-shadow: 0 0 10px rgba(0,180,255,0.06);
  }
</style>
</head>
<body>

<div class="scoreboard">
  <!-- Left endcap -->
  <div class="endcap left"><div class="endcap-outline"></div></div>

  <!-- Chrome divider -->
  <div class="chrome-divider"></div>

  <div class="team-block away">
    <div class="team-name-pill" id="awayName">
      <div class="chrome-top-line"></div>
      <span class="team-name-inner">AWAY</span>
    </div>
    <div class="chrome-divider"></div>
    <div class="score-box">
      <div class="score-box-chrome"></div>
      <span id="awayScore" style="margin-top:4px;line-height:1;">0</span>
      <div class="timeout-dots" id="awayTimeouts">
        <div class="timeout-dot"></div>
        <div class="timeout-dot"></div>
        <div class="timeout-dot"></div>
      </div>
    </div>
  </div>

  <!-- Chrome divider -->
  <div class="chrome-divider"></div>

  <div class="center-block">
    <div class="center-chrome-top"></div>
    <div class="center-chrome-bot"></div>
    <div id="period" style="font-family:'Orbitron',sans-serif;font-weight:700;font-size:28px;color:#ffd960;letter-spacing:3px;line-height:1;text-shadow:0 0 14px rgba(255,217,96,0.7),0 0 6px rgba(255,217,96,0.4),0 2px 4px rgba(0,0,0,0.6);position:relative;z-index:2;">1ST</div>
  </div>

  <!-- Chrome divider -->
  <div class="chrome-divider"></div>

  <div class="team-block home">
    <div class="score-box">
      <div class="score-box-chrome"></div>
      <span id="homeScore" style="margin-top:4px;line-height:1;">0</span>
      <div class="timeout-dots" id="homeTimeouts">
        <div class="timeout-dot"></div>
        <div class="timeout-dot"></div>
        <div class="timeout-dot"></div>
      </div>
    </div>
    <div class="chrome-divider"></div>
    <div class="team-name-pill" id="homeName">
      <div class="chrome-top-line"></div>
      <span class="team-name-inner">HOME</span>
    </div>
  </div>

  <!-- Chrome divider -->
  <div class="chrome-divider"></div>

  <!-- Right endcap -->
  <div class="endcap right"><div class="endcap-outline"></div></div>

  <!-- Bottom chrome line -->
  <div class="scoreboard-bottom-chrome"></div>
</div>

<div class="info-bar">
  <div class="info-pill down" id="down">1st &amp; 10</div>
</div>

<div class="flag-glow" id="flagGlow"></div>
<div class="penalty-flag hidden" id="penaltyFlag">FLAG</div>

<div class="ticker">
  <div class="ticker-label">BGSN</div>
  <div class="ticker-content">
  <div class="ticker-scroll" id="tickerScroll">
    <span class="ticker-item">Welcome to <span>BGSN Sports Network</span></span>
    <span class="ticker-sep">&#9670;</span>
    <span class="ticker-item">Follow us for live coverage <span>every game day</span></span>
    <span class="ticker-sep">&#9670;</span>
    <span class="ticker-item">Welcome to <span>BGSN Sports Network</span></span>
    <span class="ticker-sep">&#9670;</span>
    <span class="ticker-item">Follow us for live coverage <span>every game day</span></span>
    <span class="ticker-sep">&#9670;</span>
  </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyABNKTrQKTiw4U78JGDFAw9eZDZM-3gK2s",
    authDomain: "bgsn-scoreboard.firebaseapp.com",
    projectId: "bgsn-scoreboard",
    storageBucket: "bgsn-scoreboard.firebasestorage.app",
    messagingSenderId: "888144845710",
    appId: "1:888144845710:web:fe848d883391be787622df"
  });
  const db = getFirestore(app);

  let prevHome = null, prevAway = null;

  function initDots() {
    ['homeTimeouts','awayTimeouts'].forEach(id => {
      const container = document.getElementById(id);
      if (!container) return;
      container.querySelectorAll('.timeout-dot').forEach(d => d.classList.remove('used'));
    });
  }
  initDots();

  // Slower ticker: 35px/sec instead of 77px/sec
  function initTickerSpeed() {
    const el = document.getElementById('tickerScroll');
    if (!el) return;
    requestAnimationFrame(() => {
      const width = el.scrollWidth / 2;
      if (width > 0) {
        const duration = width / 35;
        el.style.animation = `scroll-left ${duration}s linear infinite`;
      }
    });
  }
  window.addEventListener('load', initTickerSpeed);

  function bump(id) {
    const el = document.getElementById(id);
    const box = el.closest ? el.closest('.score-box') : el.parentElement;
    if (box) {
      box.classList.remove('bump');
      void box.offsetWidth;
      box.classList.add('bump');
    }
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  onSnapshot(doc(db, 'scoreboard', 'live'), (snap) => {
    if (!snap.exists()) return;
    const d = snap.data();

    const set = (id, val) => {
      if (val == null) return;
      const el = document.getElementById(id);
      if (!el) return;
      // For pills with inner span, update the inner text
      const inner = el.querySelector('.team-name-inner');
      if (inner) { inner.textContent = val; }
      else { el.textContent = val; }
    };
    set('homeName', d.homeName);
    set('awayName', d.awayName);
    if (d.period != null) { document.getElementById('period').textContent = d.period; }
    set('down', d.down);

    if (d.homeScore != null && String(d.homeScore) !== prevHome) {
      const scoreEl = document.getElementById('homeScore');
      if (scoreEl) scoreEl.textContent = d.homeScore;
      if (prevHome !== null) bump('homeScore');
      prevHome = String(d.homeScore);
    }
    if (d.awayScore != null && String(d.awayScore) !== prevAway) {
      const scoreEl = document.getElementById('awayScore');
      if (scoreEl) scoreEl.textContent = d.awayScore;
      if (prevAway !== null) bump('awayScore');
      prevAway = String(d.awayScore);
    }

    if (d.ticker) {
      const items = d.ticker.split('|').map(t => t.trim()).filter(Boolean);
      const doubled = [...items, ...items];
      const el = document.getElementById('tickerScroll');
      el.innerHTML = doubled
        .map(t => `<span class="ticker-item">${t}</span><span class="ticker-sep">&#9670;</span>`)
        .join('');
      // Slower ticker speed
      requestAnimationFrame(() => {
        const width = el.scrollWidth / 2;
        const duration = width / 35;
        el.style.animation = `scroll-left ${duration}s linear infinite`;
      });
    }

    const flag = document.getElementById('penaltyFlag');
    const glow = document.getElementById('flagGlow');
    const downEl = document.getElementById('down');
    const penaltyOn = !!d.penalty;
    if (flag) flag.classList.toggle('hidden', !penaltyOn);
    if (glow) glow.classList.toggle('visible', penaltyOn);
    // Toggle yellow outline on entire scoreboard
    const sb = document.querySelector('.scoreboard');
    if (sb) sb.classList.toggle('penalty-active', penaltyOn);
    if (downEl) {
      const shouldShow = !penaltyOn && d.showDown !== false && d.showDown !== 'false';
      downEl.classList.toggle('hidden', !shouldShow);
    }

    function updateDots(id, remaining) {
      const container = document.getElementById(id);
      if (!container) return;
      const dots = container.querySelectorAll('.timeout-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('used', i >= remaining);
      });
    }
    if (d.homeTimeouts != null) updateDots('homeTimeouts', d.homeTimeouts);
    if (d.awayTimeouts != null) updateDots('awayTimeouts', d.awayTimeouts);

    if (d.homeColor) {
      const hc = d.homeColor;
      const hcDark = hc + 'cc';
      document.querySelector(':root').style.setProperty('--home-color', hc);
      document.querySelector(':root').style.setProperty('--home-accent', hc);
      const homeScore = document.querySelector('.team-block.home .score-box');
      if (homeScore) homeScore.style.background = `linear-gradient(180deg, ${hc} 0%, ${hcDark} 100%)`;
      document.querySelector(':root').style.setProperty('--home-glow', `${hc}88`);
      const homePill = document.querySelector('.team-block.home .team-name-pill');
      // Pre-mix team color with dark background for opaque gradient
      if (homePill) {
        const r = parseInt(hc.slice(1,3),16), g = parseInt(hc.slice(3,5),16), b = parseInt(hc.slice(5,7),16);
        const mix = (t) => `rgb(${Math.round(r*t+10*(1-t))},${Math.round(g*t+10*(1-t))},${Math.round(b*t+14*(1-t))})`;
        homePill.style.background = `linear-gradient(90deg, ${hc} 0%, ${mix(0.6)} 25%, ${mix(0.3)} 45%, ${mix(0.12)} 65%, #10101e 80%, #0a0a18 100%)`;
      }
    }
    if (d.awayColor) {
      const ac = d.awayColor;
      const acDark = ac + 'cc';
      document.querySelector(':root').style.setProperty('--away-color', ac);
      document.querySelector(':root').style.setProperty('--away-accent', ac);
      const awayScore = document.querySelector('.team-block.away .score-box');
      if (awayScore) awayScore.style.background = `linear-gradient(180deg, ${ac} 0%, ${acDark} 100%)`;
      document.querySelector(':root').style.setProperty('--away-glow', `${ac}88`);
      const awayPill = document.querySelector('.team-block.away .team-name-pill');
      // Pre-mix team color with dark background for opaque gradient
      if (awayPill) {
        const r = parseInt(ac.slice(1,3),16), g = parseInt(ac.slice(3,5),16), b = parseInt(ac.slice(5,7),16);
        const mix = (t) => `rgb(${Math.round(r*t+10*(1-t))},${Math.round(g*t+10*(1-t))},${Math.round(b*t+14*(1-t))})`;
        awayPill.style.background = `linear-gradient(90deg, #0a0a18 0%, #10101e 15%, ${mix(0.12)} 35%, ${mix(0.3)} 55%, ${mix(0.6)} 75%, ${ac} 100%)`;
      }
    }
  });
</script>
</body>
</html>
