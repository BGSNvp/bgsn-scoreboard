<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BGSN Clock Camera</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #111;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
}
h1 {
  font-size: 18px;
  color: #ffd960;
  margin-bottom: 12px;
  text-align: center;
}
.status {
  font-size: 14px;
  padding: 6px 14px;
  border-radius: 20px;
  margin-bottom: 16px;
  font-weight: 600;
}
.status.connecting { background: #553300; color: #ffaa00; }
.status.live { background: #003300; color: #00ff66; }
.status.error { background: #330000; color: #ff4444; }
.status.waiting { background: #222; color: #aaa; }
#preview {
  width: 100%;
  max-width: 400px;
  border-radius: 8px;
  background: #000;
  margin-bottom: 16px;
}
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 16px;
}
button {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:active { opacity: 0.7; }
#startBtn { background: #0a6; color: #fff; }
#stopBtn { background: #a33; color: #fff; }
#switchBtn { background: #335; color: #fff; }
.info {
  font-size: 12px;
  color: #888;
  text-align: center;
  max-width: 350px;
  line-height: 1.5;
}
.cam-select {
  margin-bottom: 16px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.cam-select label { font-size: 14px; color: #aaa; }
.cam-select select {
  padding: 6px 10px;
  border-radius: 6px;
  background: #222;
  color: #fff;
  border: 1px solid #444;
  font-size: 14px;
}
.crop-btn {
  width: 30px; height: 30px;
  background: #333; border: 1px solid #555; border-radius: 6px;
  color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.crop-btn:active { background: #555; }
#dimOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.95);
  z-index: 9999;
  display: none;
  transition: opacity 0.4s;
  opacity: 0;
}
#dimOverlay.active { display: block; opacity: 1; }
</style>
</head>
<body>

<div id="dimOverlay"></div>

<h1>BGSN Clock Camera (WebRTC)</h1>
<div class="status waiting" id="status">Ready</div>

<video id="preview" autoplay muted playsinline></video>

<div class="cam-select">
  <label>Camera:</label>
  <select id="camSelect"></select>
</div>

<div class="cam-select">
  <label>FPS:</label>
  <select id="fpsSelect"><option value="5" selected>5 (clock)</option><option value="10">10</option><option value="15">15</option><option value="24">24</option><option value="30">30</option></select>
</div>

<div class="cam-select" id="zoomRow" style="display:none;">
  <label>Zoom:</label>
  <input type="range" id="zoomSlider" min="1" max="1" step="0.1" value="1" style="width:160px;accent-color:#ffd960;">
  <span id="zoomVal" style="font-size:13px;color:#fff;min-width:32px;">1.0x</span>
</div>

<div id="cropControls" style="display:none;margin-bottom:16px;text-align:center;">
  <div style="font-size:12px;color:#aaa;margin-bottom:8px;letter-spacing:1px;">CROP</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-size:11px;color:#888;width:10px;">T</span>
      <button class="crop-btn" onclick="adjustCrop('t',-2)">−</button>
      <span id="cropT" style="font-size:13px;color:#fff;min-width:24px;text-align:center;">0</span>
      <button class="crop-btn" onclick="adjustCrop('t',2)">+</button>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:11px;color:#888;width:10px;">L</span>
        <button class="crop-btn" onclick="adjustCrop('l',-2)">−</button>
        <span id="cropL" style="font-size:13px;color:#fff;min-width:24px;text-align:center;">0</span>
        <button class="crop-btn" onclick="adjustCrop('l',2)">+</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:11px;color:#888;width:10px;">R</span>
        <button class="crop-btn" onclick="adjustCrop('r',-2)">−</button>
        <span id="cropR" style="font-size:13px;color:#fff;min-width:24px;text-align:center;">0</span>
        <button class="crop-btn" onclick="adjustCrop('r',2)">+</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-size:11px;color:#888;width:10px;">B</span>
      <button class="crop-btn" onclick="adjustCrop('b',-2)">−</button>
      <span id="cropB" style="font-size:13px;color:#fff;min-width:24px;text-align:center;">0</span>
      <button class="crop-btn" onclick="adjustCrop('b',2)">+</button>
    </div>
  </div>
</div>

<div id="fpsIndicator" style="display:none;font-size:13px;color:#ffd960;font-weight:600;margin-bottom:12px;">⚡ 5 FPS</div>
<div id="relayIndicator" style="display:none;font-size:12px;color:#888;margin-bottom:12px;"></div>

<div class="controls">
  <button id="startBtn">Start Streaming</button>
  <button id="stopBtn" style="display:none;">Stop</button>
</div>

<div class="info">
  Open this page on the phone pointed at the field clock.<br>
  The scoreboard overlay will receive the video via WebRTC.<br>
  Both devices must be on the same Wi-Fi.
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, deleteDoc, collection, addDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyABNKTrQKTiw4U78JGDFAw9eZDZM-3gK2s",
  authDomain: "bgsn-scoreboard.firebaseapp.com",
  projectId: "bgsn-scoreboard",
  storageBucket: "bgsn-scoreboard.firebasestorage.app",
  messagingSenderId: "888144845710",
  appId: "1:888144845710:web:fe848d883391be787622df"
});
const db = getFirestore(app);

const statusEl = document.getElementById('status');
const preview = document.getElementById('preview');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const camSelect = document.getElementById('camSelect');
const fpsSelect = document.getElementById('fpsSelect');
const zoomSlider = document.getElementById('zoomSlider');
const zoomVal = document.getElementById('zoomVal');
const zoomRow = document.getElementById('zoomRow');
const fpsIndicator = document.getElementById('fpsIndicator');
const relayIndicator = document.getElementById('relayIndicator');

let pc = null;
let localStream = null;
let unsubAnswer = null;
let unsubCandidates = null;
let wakeLock = null;
let videoTrack = null;

// ─── Frame relay (for overlays without WebRTC, e.g. YoloBox) ───
// While streaming, periodically snapshot a small JPEG of the camera and push it
// to scoreboard/clockFrame. Overlays that can't do WebRTC display these frames.
// Every upload is a Firestore write, so the relay is rate-limited:
//  - at most RELAY_FPS uploads/sec
//  - frames that look the same as the last upload are skipped, except for a
//    heartbeat every RELAY_HEARTBEAT_MS so the overlay doesn't go stale
//  - a daily write budget (reset at midnight Pacific) leaves quota for scores
//  - failed writes (quota exhausted, offline) trigger exponential back-off
const RELAY_FPS = 1;
const RELAY_W = 400, RELAY_H = 300;
const RELAY_HEARTBEAT_MS = 3000;
const RELAY_DAILY_BUDGET = 18000;
const RELAY_DIFF_W = 50, RELAY_DIFF_H = 38;   // downsampled grid for change detection
const RELAY_PIXEL_DELTA = 40;                 // per-channel change to count a pixel
const RELAY_CHANGED_FRAC = 0.005;             // fraction of pixels that must change
const RELAY_BACKOFF_MAX_MS = 60000;
const RELAY_REPORT_EVERY = 100;               // publish the day's count to scoreboard/live every N writes
const relayCanvas = document.createElement('canvas');
const relayCtx = relayCanvas.getContext('2d');
const diffCanvas = document.createElement('canvas');
const diffCtx = diffCanvas.getContext('2d', { willReadFrequently: true });
let relayTimer = null;
let relayUploading = false;
let relayPrevPixels = null;
let relayLastSentAt = 0;
let relayBackoffMs = 0;
let relayPausedUntil = 0;
let relayReportedPaused = false;

// Pacific-time day key, e.g. "2026-05-21" (Firestore's free quota resets at midnight PT)
function pacificDayKey() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' }).format(new Date());
}

function relayBudget() {
  const day = pacificDayKey();
  let rec = null;
  try { rec = JSON.parse(localStorage.getItem('relayWrites') || 'null'); } catch(e) {}
  if (!rec || rec.day !== day) rec = { day, count: 0 };
  return rec;
}

function relayCountWrite() {
  const rec = relayBudget();
  rec.count++;
  try { localStorage.setItem('relayWrites', JSON.stringify(rec)); } catch(e) {}
  return rec.count;
}

// Mirror the relay counter onto scoreboard/live (which controllers already
// watch) so it can be seen away from the phone. Costs 1 write per
// RELAY_REPORT_EVERY frames, plus one when the budget pauses the relay.
function reportRelayCount(count, paused) {
  updateDoc(liveDocRef, {
    relayWrites: count,
    relayBudget: RELAY_DAILY_BUDGET,
    relayDay: pacificDayKey(),
    relayPaused: !!paused,
    relayAt: Date.now()
  }).catch(() => {});
}

function setRelayIndicator(text, color) {
  relayIndicator.textContent = text;
  relayIndicator.style.color = color || '#888';
  relayIndicator.style.display = text ? '' : 'none';
}

function frameChanged() {
  diffCtx.drawImage(preview, 0, 0, RELAY_DIFF_W, RELAY_DIFF_H);
  const px = diffCtx.getImageData(0, 0, RELAY_DIFF_W, RELAY_DIFF_H).data;
  const prev = relayPrevPixels;
  relayPrevPixels = px;
  if (!prev) return true;
  let changed = 0;
  const total = RELAY_DIFF_W * RELAY_DIFF_H;
  for (let i = 0; i < px.length; i += 4) {
    if (Math.abs(px[i] - prev[i]) > RELAY_PIXEL_DELTA ||
        Math.abs(px[i+1] - prev[i+1]) > RELAY_PIXEL_DELTA ||
        Math.abs(px[i+2] - prev[i+2]) > RELAY_PIXEL_DELTA) changed++;
  }
  return changed / total >= RELAY_CHANGED_FRAC;
}

async function relayTick() {
  if (relayUploading || !preview.videoWidth) return;
  const now = Date.now();
  if (now < relayPausedUntil) return;

  const budget = relayBudget();
  if (budget.count >= RELAY_DAILY_BUDGET) {
    setRelayIndicator('Clock relay paused \u2014 daily Firebase budget reached (resumes after midnight PT)', '#f87171');
    if (!relayReportedPaused) { relayReportedPaused = true; reportRelayCount(budget.count, true); }
    return;
  }
  relayReportedPaused = false;

  const heartbeatDue = now - relayLastSentAt >= RELAY_HEARTBEAT_MS;
  if (!frameChanged() && !heartbeatDue) return;

  relayUploading = true;
  try {
    relayCtx.drawImage(preview, 0, 0, RELAY_W, RELAY_H);
    const jpeg = relayCanvas.toDataURL('image/jpeg', 0.5);
    await setDoc(doc(db, 'scoreboard', 'clockFrame'), { jpeg, ts: Date.now() });
    relayLastSentAt = Date.now();
    relayBackoffMs = 0;
    const count = relayCountWrite();
    if (count % RELAY_REPORT_EVERY === 0) reportRelayCount(count, false);
    setRelayIndicator('Clock relay: ' + count.toLocaleString() + ' / ' + RELAY_DAILY_BUDGET.toLocaleString() + ' writes today');
  } catch(e) {
    relayBackoffMs = Math.min(RELAY_BACKOFF_MAX_MS, relayBackoffMs ? relayBackoffMs * 2 : 2000);
    relayPausedUntil = Date.now() + relayBackoffMs;
    setRelayIndicator('Clock relay write failed \u2014 retrying in ' + Math.round(relayBackoffMs / 1000) + 's', '#fbbf24');
  } finally {
    relayUploading = false;
  }
}

function startFrameRelay() {
  stopFrameRelay();
  relayCanvas.width = RELAY_W;
  relayCanvas.height = RELAY_H;
  diffCanvas.width = RELAY_DIFF_W;
  diffCanvas.height = RELAY_DIFF_H;
  relayPrevPixels = null;
  relayLastSentAt = 0;
  relayBackoffMs = 0;
  relayPausedUntil = 0;
  relayTimer = setInterval(relayTick, 1000 / RELAY_FPS);
}

function stopFrameRelay() {
  if (relayTimer) { clearInterval(relayTimer); relayTimer = null; }
  setRelayIndicator('');
}

// ─── Crop controls ───
const cropControls = document.getElementById('cropControls');
const cropVals = { t: 0, r: 0, b: 0, l: 0 };
const liveDocRef = doc(db, 'scoreboard', 'live');

// Load current WebRTC crop from Firebase
onSnapshot(liveDocRef, (snap) => {
  const d = snap.data();
  if (!d) return;
  if (d.webrtcCropTop != null) cropVals.t = d.webrtcCropTop;
  if (d.webrtcCropRight != null) cropVals.r = d.webrtcCropRight;
  if (d.webrtcCropBottom != null) cropVals.b = d.webrtcCropBottom;
  if (d.webrtcCropLeft != null) cropVals.l = d.webrtcCropLeft;
  updateCropUI();
});

function updateCropUI() {
  document.getElementById('cropT').textContent = cropVals.t;
  document.getElementById('cropR').textContent = cropVals.r;
  document.getElementById('cropB').textContent = cropVals.b;
  document.getElementById('cropL').textContent = cropVals.l;
}

window.adjustCrop = function(side, delta) {
  cropVals[side] = Math.max(0, Math.min(140, (cropVals[side] || 0) + delta));
  updateCropUI();
  updateDoc(liveDocRef, {
    webrtcCropTop: cropVals.t,
    webrtcCropRight: cropVals.r,
    webrtcCropBottom: cropVals.b,
    webrtcCropLeft: cropVals.l
  }).catch(() => {});
};

// Enumerate all video cameras and populate the dropdown
async function enumerateCameras() {
  try {
    // Request a temporary stream to trigger permission (needed for labels)
    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
    tempStream.getTracks().forEach(t => t.stop());
  } catch(e) { /* permission denied — labels may be blank */ }
  const devices = await navigator.mediaDevices.enumerateDevices();
  const videoDevices = devices.filter(d => d.kind === 'videoinput');
  camSelect.innerHTML = '';
  videoDevices.forEach((dev, i) => {
    const opt = document.createElement('option');
    opt.value = dev.deviceId;
    opt.textContent = dev.label || ('Camera ' + (i + 1));
    camSelect.appendChild(opt);
  });
}
enumerateCameras();

// Zoom control
function setupZoom(track) {
  videoTrack = track;
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.zoom) {
    zoomRow.style.display = 'flex';
    zoomSlider.min = caps.zoom.min;
    zoomSlider.max = caps.zoom.max;
    zoomSlider.step = caps.zoom.step || 0.1;
    const settings = track.getSettings();
    zoomSlider.value = settings.zoom || caps.zoom.min;
    zoomVal.textContent = parseFloat(zoomSlider.value).toFixed(1) + 'x';
  } else {
    zoomRow.style.display = 'none';
  }
}
zoomSlider.addEventListener('input', () => {
  if (videoTrack) {
    videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(zoomSlider.value) }] });
    zoomVal.textContent = parseFloat(zoomSlider.value).toFixed(1) + 'x';
  }
});

// Wake Lock: keeps screen on while streaming
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e) { /* wake lock not supported or failed — non-critical */ }
}
async function releaseWakeLock() {
  if (wakeLock) { await wakeLock.release(); wakeLock = null; }
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + cls;
}

// ICE servers — STUN for NAT traversal (free Google server)
// On same LAN this usually resolves directly without STUN, but included as fallback
const iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];

async function clearSignaling() {
  // Clear previous session
  try {
    const candidatesRef = collection(db, 'scoreboard', 'webrtc', 'senderCandidates');
    const snap = await getDocs(candidatesRef);
    snap.forEach(d => deleteDoc(d.ref));
  } catch(e) {}
  try {
    const candidatesRef = collection(db, 'scoreboard', 'webrtc', 'receiverCandidates');
    const snap = await getDocs(candidatesRef);
    snap.forEach(d => deleteDoc(d.ref));
  } catch(e) {}
  try {
    await deleteDoc(doc(db, 'scoreboard', 'webrtc'));
  } catch(e) {}
}

async function start() {
  setStatus('Starting camera...', 'connecting');

  try {
    const deviceId = camSelect.value;
    const fps = parseInt(fpsSelect.value) || 5;
    const constraints = {
      video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: fps, max: fps } },
      audio: false
    };
    // Use deviceId if available, otherwise fall back to environment facing
    if (deviceId) {
      constraints.video.deviceId = { exact: deviceId };
    } else {
      constraints.video.facingMode = 'environment';
    }
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    preview.srcObject = localStream;
    // Setup zoom for the active video track
    const vTrack = localStream.getVideoTracks()[0];
    if (vTrack) setupZoom(vTrack);
  } catch(e) {
    setStatus('Camera access denied: ' + e.message, 'error');
    return;
  }

  setStatus('Setting up connection...', 'connecting');

  // Clear old signaling data
  await clearSignaling();

  // Create peer connection
  pc = new RTCPeerConnection({ iceServers });

  // Add local tracks
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  // Collect ICE candidates and send to Firebase
  const senderCandidatesRef = collection(db, 'scoreboard', 'webrtc', 'senderCandidates');
  pc.onicecandidate = (event) => {
    if (event.candidate) {
      addDoc(senderCandidatesRef, event.candidate.toJSON());
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      setStatus('LIVE — Streaming to overlay', 'live');
    } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
      setStatus('Reconnecting...', 'connecting');
      // Auto-reconnect: restart the connection after a short delay
      setTimeout(() => { if (localStream) { reconnect(); } }, 3000);
    }
  };

  // Create offer
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // Write offer to Firebase
  await setDoc(doc(db, 'scoreboard', 'webrtc'), {
    offer: { type: offer.type, sdp: offer.sdp },
    timestamp: Date.now()
  });

  setStatus('Waiting for overlay to connect...', 'waiting');

  // Listen for answer from overlay
  unsubAnswer = onSnapshot(doc(db, 'scoreboard', 'webrtc'), (snap) => {
    const data = snap.data();
    if (data && data.answer && !pc.currentRemoteDescription) {
      const answer = new RTCSessionDescription(data.answer);
      pc.setRemoteDescription(answer);
      setStatus('Connecting...', 'connecting');
    }
  });

  // Listen for receiver ICE candidates
  const receiverCandidatesRef = collection(db, 'scoreboard', 'webrtc', 'receiverCandidates');
  unsubCandidates = onSnapshot(receiverCandidatesRef, (snap) => {
    snap.docChanges().forEach(change => {
      if (change.type === 'added') {
        const candidate = new RTCIceCandidate(change.doc.data());
        pc.addIceCandidate(candidate);
      }
    });
  });

  // Keep screen on while streaming
  await requestWakeLock();

  // Show FPS indicator
  const fps = parseInt(fpsSelect.value) || 5;
  fpsIndicator.textContent = '\u26A1 ' + fps + ' FPS';
  fpsIndicator.style.display = '';

  // Show crop controls
  cropControls.style.display = '';

  // Start pushing frames for overlays that can't do WebRTC (e.g. YoloBox)
  startFrameRelay();

  startBtn.style.display = 'none';
  stopBtn.style.display = '';
}

async function reconnect() {
  // Rebuild the peer connection using the existing localStream
  if (unsubAnswer) { unsubAnswer(); unsubAnswer = null; }
  if (unsubCandidates) { unsubCandidates(); unsubCandidates = null; }
  if (pc) { pc.close(); pc = null; }
  await clearSignaling();

  pc = new RTCPeerConnection({ iceServers });
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  const senderCandidatesRef = collection(db, 'scoreboard', 'webrtc', 'senderCandidates');
  pc.onicecandidate = (event) => {
    if (event.candidate) {
      addDoc(senderCandidatesRef, event.candidate.toJSON());
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      setStatus('LIVE — Streaming to overlay', 'live');
    } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
      setStatus('Reconnecting...', 'connecting');
      setTimeout(() => { if (localStream) { reconnect(); } }, 3000);
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await setDoc(doc(db, 'scoreboard', 'webrtc'), {
    offer: { type: offer.type, sdp: offer.sdp },
    timestamp: Date.now()
  });

  unsubAnswer = onSnapshot(doc(db, 'scoreboard', 'webrtc'), (snap) => {
    const data = snap.data();
    if (data && data.answer && !pc.currentRemoteDescription) {
      pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
  });

  const receiverCandidatesRef = collection(db, 'scoreboard', 'webrtc', 'receiverCandidates');
  unsubCandidates = onSnapshot(receiverCandidatesRef, (snap) => {
    snap.docChanges().forEach(change => {
      if (change.type === 'added') {
        pc.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(() => {});
      }
    });
  });
}

async function stop() {
  stopFrameRelay();
  if (unsubAnswer) { unsubAnswer(); unsubAnswer = null; }
  if (unsubCandidates) { unsubCandidates(); unsubCandidates = null; }
  if (pc) { pc.close(); pc = null; }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  preview.srcObject = null;
  await clearSignaling();
  await releaseWakeLock();
  setStatus('Stopped', 'waiting');
  fpsIndicator.style.display = 'none';
  cropControls.style.display = 'none';
  startBtn.style.display = '';
  stopBtn.style.display = 'none';
}

startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);

// ─── Auto-dim screen after 10s of no touch ───
const dimOverlay = document.getElementById('dimOverlay');
let dimTimer = null;

function resetDimTimer() {
  // Brighten immediately
  dimOverlay.classList.remove('active');
  setTimeout(() => { if (!dimOverlay.classList.contains('active')) dimOverlay.style.display = 'none'; }, 400);
  // Restart countdown
  clearTimeout(dimTimer);
  dimTimer = setTimeout(() => {
    dimOverlay.style.display = 'block';
    requestAnimationFrame(() => dimOverlay.classList.add('active'));
  }, 10000);
}

// Any touch/click resets the timer
['touchstart', 'mousedown', 'click'].forEach(evt => {
  document.addEventListener(evt, resetDimTimer, { passive: true });
});

// Tap on the dim overlay itself to brighten
dimOverlay.addEventListener('touchstart', resetDimTimer, { passive: true });
dimOverlay.addEventListener('click', resetDimTimer);

// Start the timer
resetDimTimer();
</script>
</body>
</html>
