<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BGSN Clock Camera</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #111;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
}
h1 {
  font-size: 18px;
  color: #ffd960;
  margin-bottom: 12px;
  text-align: center;
}
.status {
  font-size: 14px;
  padding: 6px 14px;
  border-radius: 20px;
  margin-bottom: 16px;
  font-weight: 600;
}
.status.connecting { background: #553300; color: #ffaa00; }
.status.live { background: #003300; color: #00ff66; }
.status.error { background: #330000; color: #ff4444; }
.status.waiting { background: #222; color: #aaa; }
#preview {
  width: 100%;
  max-width: 400px;
  border-radius: 8px;
  background: #000;
  margin-bottom: 16px;
}
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 16px;
}
button {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:active { opacity: 0.7; }
#startBtn { background: #0a6; color: #fff; }
#stopBtn { background: #a33; color: #fff; }
#switchBtn { background: #335; color: #fff; }
.info {
  font-size: 12px;
  color: #888;
  text-align: center;
  max-width: 350px;
  line-height: 1.5;
}
.cam-select {
  margin-bottom: 16px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.cam-select label { font-size: 14px; color: #aaa; }
.cam-select select {
  padding: 6px 10px;
  border-radius: 6px;
  background: #222;
  color: #fff;
  border: 1px solid #444;
  font-size: 14px;
}
</style>
</head>
<body>

<h1>BGSN Clock Camera (WebRTC)</h1>
<div class="status waiting" id="status">Ready</div>

<video id="preview" autoplay muted playsinline></video>

<div class="cam-select">
  <label>Camera:</label>
  <select id="camSelect"></select>
</div>

<div class="cam-select">
  <label>FPS:</label>
  <select id="fpsSelect"><option value="5" selected>5 (clock)</option><option value="10">10</option><option value="15">15</option><option value="24">24</option><option value="30">30</option></select>
</div>

<div class="cam-select" id="zoomRow" style="display:none;">
  <label>Zoom:</label>
  <input type="range" id="zoomSlider" min="1" max="1" step="0.1" value="1" style="width:160px;accent-color:#ffd960;">
  <span id="zoomVal" style="font-size:13px;color:#fff;min-width:32px;">1.0x</span>
</div>

<div class="controls">
  <button id="startBtn">Start Streaming</button>
  <button id="stopBtn" style="display:none;">Stop</button>
</div>

<div class="info">
  Open this page on the phone pointed at the field clock.<br>
  The scoreboard overlay will receive the video via WebRTC.<br>
  Both devices must be on the same Wi-Fi.
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, deleteDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyABNKTrQKTiw4U78JGDFAw9eZDZM-3gK2s",
  authDomain: "bgsn-scoreboard.firebaseapp.com",
  projectId: "bgsn-scoreboard",
  storageBucket: "bgsn-scoreboard.firebasestorage.app",
  messagingSenderId: "888144845710",
  appId: "1:888144845710:web:fe848d883391be787622df"
});
const db = getFirestore(app);

const statusEl = document.getElementById('status');
const preview = document.getElementById('preview');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const camSelect = document.getElementById('camSelect');
const fpsSelect = document.getElementById('fpsSelect');
const zoomSlider = document.getElementById('zoomSlider');
const zoomVal = document.getElementById('zoomVal');
const zoomRow = document.getElementById('zoomRow');

let pc = null;
let localStream = null;
let unsubAnswer = null;
let unsubCandidates = null;
let wakeLock = null;
let videoTrack = null;

// Enumerate all video cameras and populate the dropdown
async function enumerateCameras() {
  try {
    // Request a temporary stream to trigger permission (needed for labels)
    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
    tempStream.getTracks().forEach(t => t.stop());
  } catch(e) { /* permission denied — labels may be blank */ }
  const devices = await navigator.mediaDevices.enumerateDevices();
  const videoDevices = devices.filter(d => d.kind === 'videoinput');
  camSelect.innerHTML = '';
  videoDevices.forEach((dev, i) => {
    const opt = document.createElement('option');
    opt.value = dev.deviceId;
    opt.textContent = dev.label || ('Camera ' + (i + 1));
    camSelect.appendChild(opt);
  });
}
enumerateCameras();

// Zoom control
function setupZoom(track) {
  videoTrack = track;
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.zoom) {
    zoomRow.style.display = 'flex';
    zoomSlider.min = caps.zoom.min;
    zoomSlider.max = caps.zoom.max;
    zoomSlider.step = caps.zoom.step || 0.1;
    const settings = track.getSettings();
    zoomSlider.value = settings.zoom || caps.zoom.min;
    zoomVal.textContent = parseFloat(zoomSlider.value).toFixed(1) + 'x';
  } else {
    zoomRow.style.display = 'none';
  }
}
zoomSlider.addEventListener('input', () => {
  if (videoTrack) {
    videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(zoomSlider.value) }] });
    zoomVal.textContent = parseFloat(zoomSlider.value).toFixed(1) + 'x';
  }
});

// Wake Lock: keeps screen on while streaming
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e) { /* wake lock not supported or failed — non-critical */ }
}
async function releaseWakeLock() {
  if (wakeLock) { await wakeLock.release(); wakeLock = null; }
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + cls;
}

// ICE servers — STUN for NAT traversal (free Google server)
// On same LAN this usually resolves directly without STUN, but included as fallback
const iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];

async function clearSignaling() {
  // Clear previous session
  try {
    const candidatesRef = collection(db, 'scoreboard', 'webrtc', 'senderCandidates');
    const snap = await getDocs(candidatesRef);
    snap.forEach(d => deleteDoc(d.ref));
  } catch(e) {}
  try {
    const candidatesRef = collection(db, 'scoreboard', 'webrtc', 'receiverCandidates');
    const snap = await getDocs(candidatesRef);
    snap.forEach(d => deleteDoc(d.ref));
  } catch(e) {}
  try {
    await deleteDoc(doc(db, 'scoreboard', 'webrtc'));
  } catch(e) {}
}

async function start() {
  setStatus('Starting camera...', 'connecting');

  try {
    const deviceId = camSelect.value;
    const fps = parseInt(fpsSelect.value) || 5;
    const constraints = {
      video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: fps, max: fps } },
      audio: false
    };
    // Use deviceId if available, otherwise fall back to environment facing
    if (deviceId) {
      constraints.video.deviceId = { exact: deviceId };
    } else {
      constraints.video.facingMode = 'environment';
    }
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    preview.srcObject = localStream;
    // Setup zoom for the active video track
    const vTrack = localStream.getVideoTracks()[0];
    if (vTrack) setupZoom(vTrack);
  } catch(e) {
    setStatus('Camera access denied: ' + e.message, 'error');
    return;
  }

  setStatus('Setting up connection...', 'connecting');

  // Clear old signaling data
  await clearSignaling();

  // Create peer connection
  pc = new RTCPeerConnection({ iceServers });

  // Add local tracks
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  // Collect ICE candidates and send to Firebase
  const senderCandidatesRef = collection(db, 'scoreboard', 'webrtc', 'senderCandidates');
  pc.onicecandidate = (event) => {
    if (event.candidate) {
      addDoc(senderCandidatesRef, event.candidate.toJSON());
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      setStatus('LIVE — Streaming to overlay', 'live');
    } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
      setStatus('Connection lost', 'error');
    }
  };

  // Create offer
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // Write offer to Firebase
  await setDoc(doc(db, 'scoreboard', 'webrtc'), {
    offer: { type: offer.type, sdp: offer.sdp },
    timestamp: Date.now()
  });

  setStatus('Waiting for overlay to connect...', 'waiting');

  // Listen for answer from overlay
  unsubAnswer = onSnapshot(doc(db, 'scoreboard', 'webrtc'), (snap) => {
    const data = snap.data();
    if (data && data.answer && !pc.currentRemoteDescription) {
      const answer = new RTCSessionDescription(data.answer);
      pc.setRemoteDescription(answer);
      setStatus('Connecting...', 'connecting');
    }
  });

  // Listen for receiver ICE candidates
  const receiverCandidatesRef = collection(db, 'scoreboard', 'webrtc', 'receiverCandidates');
  unsubCandidates = onSnapshot(receiverCandidatesRef, (snap) => {
    snap.docChanges().forEach(change => {
      if (change.type === 'added') {
        const candidate = new RTCIceCandidate(change.doc.data());
        pc.addIceCandidate(candidate);
      }
    });
  });

  // Keep screen on while streaming
  await requestWakeLock();

  startBtn.style.display = 'none';
  stopBtn.style.display = '';
}

async function stop() {
  if (unsubAnswer) { unsubAnswer(); unsubAnswer = null; }
  if (unsubCandidates) { unsubCandidates(); unsubCandidates = null; }
  if (pc) { pc.close(); pc = null; }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  preview.srcObject = null;
  await clearSignaling();
  await releaseWakeLock();
  setStatus('Stopped', 'waiting');
  startBtn.style.display = '';
  stopBtn.style.display = 'none';
}

startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);
</script>
</body>
</html>
