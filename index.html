<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGSN Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111419;
    --border: #1e2229;
    --accent-blue: #1a6fc4;
    --accent-red: #c41a1a;
    --accent-gold: #f0c040;
    --text: #e8eaf0;
    --muted: #666c7a;
    --input-bg: #0d1017;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh; padding: 12px;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-badge {
    background: linear-gradient(135deg, #111, #1c1c1c);
    border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 6px 12px; position: relative; overflow: hidden;
  }
  .logo-badge::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent-blue), #fff 50%, var(--accent-red));
  }
  .logo-name {
    font-family: 'Orbitron', monospace; font-weight: 900;
    font-size: 18px; letter-spacing: 5px; color: #fff;
  }
  .logo-sub { font-size: 9px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .header-title { font-size: 12px; font-weight: 600; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }

  .status-pill {
    display: flex; align-items: center; gap: 8px;
    background: rgba(26,111,196,0.1); border: 1px solid rgba(26,111,196,0.3);
    border-radius: 20px; padding: 6px 14px;
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    color: var(--accent-blue); text-transform: uppercase;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent-blue);
    animation: pulse 2s ease-in-out infinite;
  }
  .status-pill.error { color: var(--accent-red); background: rgba(196,26,26,0.1); border-color: rgba(196,26,26,0.3); }
  .status-pill.error .status-dot { background: var(--accent-red); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .grid {
    display: grid; grid-template-columns: 1fr;
    gap: 8px; max-width: 500px; margin: 0 auto;
  }

  .card {
    background: var(--surface);
    border: none; border-radius: var(--radius); padding: 12px;
    position: relative; overflow: hidden;
  }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .card.blue::before { background: var(--accent-blue); }
  .card.red::before  { background: var(--accent-red); }
  .card.gold::before { background: var(--accent-gold); }
  .card.wide { grid-column: span 1; }

  .card-title {
    font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 14px;
  }

  label {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px;
  }
  input[type="text"], input[type="number"] {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text);
    font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600;
    letter-spacing: 1px; padding: 12px 14px; outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent-blue); }
  .card.red input:focus { border-color: var(--accent-red); }

  .score-control { display: flex; align-items: center; gap: 8px; }
  .score-control input {
    text-align: center; font-family: 'Orbitron', monospace;
    font-size: 30px; font-weight: 900; width: 84px; flex-shrink: 0;
  }
  .score-btn {
    flex: 1; background: transparent; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text);
    font-family: 'Orbitron', monospace; font-size: 28px; font-weight: 900;
    padding: 14px 0; cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    user-select: none; min-height: 56px;
  }
  .score-btn:active { transform: scale(0.94); }
  .card.blue .score-btn.plus:hover { background: rgba(26,111,196,0.25); border-color: var(--accent-blue); }
  .card.red  .score-btn.plus:hover { background: rgba(196,26,26,0.25);  border-color: var(--accent-red); }
  .score-btn.minus:hover { background: rgba(255,255,255,0.05); }

  .quick-scores { display: flex; gap: 5px; margin-top: 9px; }
  .quick-btn {
    flex: 1; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 5px; color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700;
    letter-spacing: 1px; padding: 10px 0; cursor: pointer;
    transition: all 0.15s; text-transform: uppercase; min-height: 44px;
  }
  .quick-btn:hover { color: var(--text); border-color: #444; background: rgba(255,255,255,0.05); }
  .quick-btn:active { transform: scale(0.95); }

  .info-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .period-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px; }
  .period-btn {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 5px; color: var(--muted);
    font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
    padding: 8px 0; cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .period-btn:hover, .period-btn.active {
    background: rgba(240,192,64,0.15); border-color: var(--accent-gold); color: var(--accent-gold);
  }
  .period-btn:active { transform: scale(0.95); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .toggle-label { font-size: 14px; font-weight: 600; color: var(--text); }
  .toggle { position: relative; width: 48px; height: 26px; cursor: pointer; }
  .toggle input { display: none; }
  .toggle-track {
    position: absolute; inset: 0; background: #1e2229;
    border-radius: 13px; transition: background 0.2s; border: 1px solid var(--border);
  }
  .toggle input:checked ~ .toggle-track { background: var(--accent-blue); border-color: var(--accent-blue); }
  .toggle-thumb {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    background: #fff; border-radius: 50%; transition: transform 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .toggle input:checked ~ .toggle-thumb { transform: translateX(22px); }

  textarea {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text);
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.5px; padding: 10px 12px; outline: none;
    resize: vertical; min-height: 65px; transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent-blue); }
  .ticker-hint { font-size: 10px; color: var(--muted); margin-top: 5px; }

  .field-group { margin-bottom: 13px; }
  .field-group:last-child { margin-bottom: 0; }

  .push-btn {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #1a6fc4, #0d4a8a);
    border: none; border-radius: var(--radius); color: #fff;
    font-family: 'Orbitron', monospace; font-weight: 900;
    font-size: 14px; letter-spacing: 3px; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s; text-transform: uppercase;
    position: relative; overflow: hidden;
  }
  .push-btn::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: rgba(255,255,255,0.08);
  }
  .push-btn:hover { opacity: 0.9; }
  .push-btn:active { transform: scale(0.98); }
  .push-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .reset-btn {
    width: 100%; padding: 10px; background: transparent;
    border: 1px solid #2a2a2a; border-radius: var(--radius);
    color: var(--muted); font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 13px; letter-spacing: 2px;
    cursor: pointer; text-transform: uppercase; margin-top: 8px;
    transition: all 0.15s;
  }
  .reset-btn:hover { border-color: #444; color: var(--text); }

  .saved-flash {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(26,111,196,0.95); color: #fff; border-radius: 6px;
    padding: 10px 18px; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0; pointer-events: none;
    transform: translateY(10px); transition: opacity 0.25s, transform 0.25s;
    z-index: 999;
  }
  .saved-flash.show { opacity: 1; transform: translateY(0); }
  .saved-flash.error-flash { background: rgba(196,26,26,0.95); }

  /* Quarter buttons */
  .qtr-btn {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px; font-weight: 700; letter-spacing: 1px;
    padding: 10px 0; cursor: pointer; text-transform: uppercase;
    transition: all 0.15s; min-height: 44px;
  }
  .qtr-btn.active {
    background: var(--accent-gold); border: 2px solid #fff;
    color: #111; font-weight: 900;
    box-shadow: 0 0 8px rgba(240,192,64,0.5);
  }

  /* Down buttons - blue toned */
  .down-btn {
    background: #0d1828; border: 1px solid #1a3a5c;
    border-radius: 6px; color: #5a8ab8;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; line-height: 1;
    cursor: pointer; text-transform: uppercase;
    transition: all 0.15s; height: 56px; min-height: 56px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .down-btn.active {
    background: #c8a84b; border: 3px solid #fff;
    color: #111; font-weight: 900;
    box-shadow: 0 0 12px rgba(200,168,75,0.7);
  }

  /* 1st & 10 reset button */
  .reset-down-btn {
    background: linear-gradient(135deg,#1a0a2e,#2a0d4a);
    border: 2px solid #9c6bd6; border-radius: 6px;
    color: #c49ef0; font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 900; letter-spacing: 0px;
    cursor: pointer; height: 56px; min-height: 56px;
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: all 0.15s;
    box-shadow: 0 0 10px rgba(156,107,214,0.4);
  }
  .reset-down-btn:active { transform: scale(0.95); }

  /* Distance buttons - amber toned */
  .dist-btn {
    background: #1a1200; border: 1px solid #3a2800;
    border-radius: 6px; color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; line-height: 1;
    cursor: pointer; transition: all 0.15s; height: 56px; min-height: 56px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .dist-btn.active {
    background: #c8a84b; border: 3px solid #fff;
    color: #111; font-weight: 900;
    box-shadow: 0 0 12px rgba(200,168,75,0.7);
  }
</style>
</head>
<body>

<header style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;margin-bottom:4px;padding-bottom:4px;">
  <div class="logo-badge" style="flex-shrink:0;">
    <div class="logo-name">BGSN</div>
    <div class="logo-sub">Sports Network</div>
  </div>
  <div class="status-pill" id="statusPill" style="flex-shrink:0;">
    <div class="status-dot"></div>
    <span id="statusText">Connecting…</span>
  </div>
  <button id="penaltyBtn" onclick="togglePenalty()" style="flex-shrink:0;background:linear-gradient(135deg,#1a1200,#2a1e00);border:2px solid #f0c040;border-radius:6px;color:#f0c040;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:2px;cursor:pointer;height:56px;min-height:56px;padding:0 14px;white-space:nowrap;">
    🚩 FLAG
  </button>
</header>

<!-- LIVE DISPLAY BAR -->
<div style="background:#0d1017;border:1px solid #1e2229;border-radius:8px;margin-bottom:8px;padding:8px 12px;max-width:500px;margin-left:auto;margin-right:auto;margin-top:0;position:relative;">
  <div style="position:absolute;top:4px;right:8px;font-size:10px;color:#444;letter-spacing:2px;text-transform:uppercase;font-weight:700;">LIVE SYNC</div>
  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;">
    <!-- Away score -->
    <div style="text-align:center;">
      <div id="disp-awayName" style="font-size:13px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;">AWAY</div>
      <div id="disp-awayScore" style="font-family:'Orbitron',monospace;font-size:32px;font-weight:900;color:#c41a1a;line-height:1;">0</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px;">
        <button onclick="adjustTimeout('away',-1)" style="width:28px;height:28px;background:#1a0808;border:1px solid #c41a1a;border-radius:5px;color:#c41a1a;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">−</button>
        <div id="disp-awayTO" style="display:flex;gap:3px;align-items:center;">
          <div class="disp-to-pill" style="width:22px;height:8px;border-radius:4px;background:#c41a1a;opacity:1;"></div>
          <div class="disp-to-pill" style="width:22px;height:8px;border-radius:4px;background:#c41a1a;opacity:1;"></div>
          <div class="disp-to-pill" style="width:22px;height:8px;border-radius:4px;background:#c41a1a;opacity:1;"></div>
        </div>
        <button onclick="adjustTimeout('away',1)" style="width:28px;height:28px;background:#1a0808;border:1px solid #c41a1a;border-radius:5px;color:#c41a1a;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">+</button>
      </div>
    </div>
    <!-- Quarter & Down center -->
    <div style="text-align:center;">
      <div id="disp-period" style="font-family:'Orbitron',monospace;font-size:22px;font-weight:700;color:#f0c040;letter-spacing:2px;">1ST</div>
      <div id="disp-down" style="font-size:40px;font-weight:700;color:var(--text);letter-spacing:1px;margin-top:2px;line-height:1;">1st &amp; 10</div>
    </div>
    <!-- Home score -->
    <div style="text-align:center;">
      <div id="disp-homeName" style="font-size:13px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;">HOME</div>
      <div id="disp-homeScore" style="font-family:'Orbitron',monospace;font-size:32px;font-weight:900;color:#1a6fc4;line-height:1;">0</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px;">
        <button onclick="adjustTimeout('home',-1)" style="width:28px;height:28px;background:#080a18;border:1px solid #1a6fc4;border-radius:5px;color:#1a6fc4;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">−</button>
        <div id="disp-homeTO" style="display:flex;gap:3px;align-items:center;">
          <div class="disp-to-pill" style="width:22px;height:8px;border-radius:4px;background:#1a6fc4;opacity:1;"></div>
          <div class="disp-to-pill" style="width:22px;height:8px;border-radius:4px;background:#1a6fc4;opacity:1;"></div>
          <div class="disp-to-pill" style="width:22px;height:8px;border-radius:4px;background:#1a6fc4;opacity:1;"></div>
        </div>
        <button onclick="adjustTimeout('home',1)" style="width:28px;height:28px;background:#080a18;border:1px solid #1a6fc4;border-radius:5px;color:#1a6fc4;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">+</button>
      </div>
    </div>
  </div>
</div>

<div class="grid">

  <!-- GAME INFO -->
  <div class="card wide" style="background:#161a20;border:none;">
    <!-- Down & Distance FIRST -->
    <div class="field-group" style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;">
        <label style="margin:0;flex:1;">Down &amp; Distance</label>
        <div style="display:flex;gap:4px;flex-shrink:0;">
          <button id="showDownBtn" onclick="setShowDown(true)" style="padding:10px 16px;min-height:44px;background:#1a3a1a;border:2px solid #4caf50;border-radius:5px;color:#4caf50;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px;">SHOW</button>
          <button id="hideDownBtn" onclick="setShowDown(false)" style="padding:10px 16px;min-height:44px;background:var(--input-bg);border:1px solid var(--border);border-radius:5px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px;">NO SHOW</button>
        </div>
        <input type="hidden" id="showDown" value="true">
      </div>
      <!-- Down row -->
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px;">
        <button class="down-btn active" onclick="setDown('1st',this)">1ST</button>
        <button class="down-btn" onclick="setDown('2nd',this)">2ND</button>
        <button class="down-btn" onclick="setDown('3rd',this)">3RD</button>
        <button class="down-btn" onclick="setDown('4th',this)">4TH</button>
        <button class="reset-down-btn" onclick="window.setFirstAndTen()">1&amp;10</button>
      </div>
      <!-- Distance rows -->
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px;row-gap:6px;">
        <button class="dist-btn" onclick="setDist('Goal',this)">GL</button>
        <button class="dist-btn" onclick="setDist('1',this)">1</button>
        <button class="dist-btn" onclick="setDist('2',this)">2</button>
        <button class="dist-btn" onclick="setDist('3',this)">3</button>
        <button class="dist-btn" onclick="setDist('4',this)">4</button>
        <button class="dist-btn" onclick="setDist('5',this)">5</button>
        <button class="dist-btn" onclick="setDist('6',this)">6</button>
        <button class="dist-btn" onclick="setDist('7',this)">7</button>
        <button class="dist-btn" onclick="setDist('8',this)">8</button>
        <button class="dist-btn" onclick="setDist('9',this)">9</button>
        <button class="dist-btn active" onclick="setDist('10',this)">10</button>
        <button class="dist-btn" onclick="setDist('11',this)">11</button>
        <button class="dist-btn" onclick="setDist('12',this)">12</button>
        <button class="dist-btn" onclick="setDist('13',this)">13</button>
        <button class="dist-btn" onclick="setDist('14',this)">14</button>
        <button class="dist-btn" onclick="setDist('15',this)">15</button>
        <button class="dist-btn" onclick="setDist('16',this)">16</button>
        <button class="dist-btn" onclick="setDist('17',this)">17</button>
        <button class="dist-btn" onclick="setDist('18',this)">18</button>
        <button class="dist-btn" onclick="setDist('19',this)">19</button>
        <button class="dist-btn" onclick="setDist('20',this)">20</button>
        <button class="dist-btn" onclick="setDist('20+',this)">20+</button>
      </div>
      <input type="hidden" id="downNum" value="1st">
      <input type="hidden" id="downDist" value="10">
      <input type="hidden" id="down" value="1st &amp; 10">
    </div>

    <!-- Quarter buttons BELOW -->
    <div class="field-group" style="margin-bottom:0;">
      <label style="margin-bottom:6px;display:block;">Quarter</label>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
        <button class="qtr-btn active" onclick="setQuarter('1ST',this)">1ST</button>
        <button class="qtr-btn" onclick="setQuarter('2ND',this)">2ND</button>
        <button class="qtr-btn" onclick="setQuarter('3RD',this)">3RD</button>
        <button class="qtr-btn" onclick="setQuarter('4TH',this)">4TH</button>
        <button class="qtr-btn" onclick="setQuarter('HALF',this)">HALF</button>
        <button class="qtr-btn" onclick="setQuarter('OT',this)">OT</button>
        <button class="qtr-btn" onclick="setQuarter('FINAL',this)">FINAL</button>
        <button class="qtr-btn" onclick="setQuarter('PRE',this)">PRE</button>
      </div>
      <input type="hidden" id="period" value="1ST">
    </div>
  </div>

  <!-- HOME -->
  <div class="card blue" id="homeCard" style="background:#12161e;border:2px solid #1a6fc4;border-radius:8px;">
    <div class="card-title" style="color:#aaa;">🏠 Home Team (Right)</div>
    <div class="field-group">
      <label>Team Name &amp; Color</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="homeName" value="HOME" maxlength="15" style="flex:1;min-width:0;">
        <input type="color" id="homeColor" value="#1a6fc4" style="width:48px;height:48px;border:1px solid var(--border);border-radius:6px;background:var(--input-bg);cursor:pointer;padding:3px;flex-shrink:0;">
        <span id="homeColorHex" style="font-size:13px;font-weight:600;color:var(--muted);letter-spacing:1px;flex-shrink:0;min-width:52px;">#1a6fc4</span>
      </div>
    </div>
    <div class="field-group">
      <label>Score</label>
      <div class="score-control">
        <button class="score-btn minus" onclick="adjustScore('home',-1)">−</button>
        <input type="number" id="homeScore" value="0" min="0" max="999" style="color:#fff;font-weight:900;">

        <button class="quick-btn" onclick="adjustScore('home',1)">+1</button>
        <button class="quick-btn" onclick="adjustScore('home',2)">+2</button>
        <button class="quick-btn" onclick="adjustScore('home',3)">+3</button>
        <button class="quick-btn" onclick="adjustScore('home',6)">+6</button>

  <div class="card red" id="awayCard" style="background:#160e0e;border:2px solid #c41a1a;border-radius:8px;">

        <span id="awayColorHex" style="font-size:13px;font-weight:600;color:var(--muted);letter-spacing:1px;flex-shrink:0;min-width:52px;">#c41a1a</span>
      </div>
    </div>
    <div class="field-group">
      <label>Score</label>
      <div class="score-control">
        <button class="score-btn minus" onclick="adjustScore('away',-1)">−</button>
        <input type="number" id="awayScore" value="0" min="0" max="999" style="color:#fff;font-weight:900;">
        <button class="score-btn plus" onclick="adjustScore('away',1)">+</button>
      </div>
      <div class="quick-scores">
        <button class="quick-btn" onclick="adjustScore('away',1)">+1</button>
        <button class="quick-btn" onclick="adjustScore('away',2)">+2</button>
        <button class="quick-btn" onclick="adjustScore('away',3)">+3</button>
        <button class="quick-btn" onclick="adjustScore('away',6)">+6</button>
        <button class="quick-btn" onclick="adjustScore('away',7)">+7</button>

    </div>
  </div>

  <!-- TIMEOUTS (hidden inputs for value tracking) -->
  <input type="hidden" id="homeTimeouts" value="3">
  <input type="hidden" id="awayTimeouts" value="3">
  <label id="homeTimeoutLabel" style="display:none;"></label>
  <label id="awayTimeoutLabel" style="display:none;"></label>

  <!-- TICKER -->
  <div class="card wide" style="background:#0e1117;border:none;">
    <div class="card-title">📺 Ticker</div>
    <div class="field-group">
      <label>Ticker Messages <span style="color:#333;font-weight:400">(separate with |)</span></label>
      <textarea id="ticker">Welcome to BGSN Sports Network | Follow us for live coverage every game day | Tune in for post-game analysis | Subscribe for full season access</textarea>
      <div class="ticker-hint">Separate each scrolling message with a | character.</div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="card wide" style="background:#0a0c10;border:none;">
    <button class="push-btn" id="pushBtn" onclick="pushUpdate()">⚡ Push to Overlay</button>
    <button class="reset-btn" onclick="resetScores()">Reset Scores to 0</button>
  </div>

</div>

<div class="saved-flash" id="savedFlash">✓ Overlay Updated</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyABNKTrQKTiw4U78JGDFAw9eZDZM-3gK2s",
    authDomain: "bgsn-scoreboard.firebaseapp.com",
    projectId: "bgsn-scoreboard",
    storageBucket: "bgsn-scoreboard.firebasestorage.app",
    messagingSenderId: "888144845710",
    appId: "1:888144845710:web:fe848d883391be787622df"
  });
  const db = getFirestore(app);
  const scoreRef = doc(db, 'scoreboard', 'live');

  const statusPill = document.getElementById('statusPill');

  function setStatus(connected) {
    statusPill.className = 'status-pill' + (connected ? '' : ' error');
    statusPill.innerHTML = `<div class="status-dot"></div>${connected ? 'Connected' : 'Offline'}`;
  }

  function getData() {
    return {
      homeTimeouts: parseInt(document.getElementById('homeTimeouts').value) ?? 3,
      awayTimeouts: parseInt(document.getElementById('awayTimeouts').value) ?? 3,
      homeColor: document.getElementById('homeColor').value,
      awayColor: document.getElementById('awayColor').value,
      homeName:  document.getElementById('homeName').value.toUpperCase(),
      awayName:  document.getElementById('awayName').value.toUpperCase(),
      homeScore: parseInt(document.getElementById('homeScore').value) || 0,
      awayScore: parseInt(document.getElementById('awayScore').value) || 0,
      period:    document.getElementById('period').value,
      down:      document.getElementById('downNum').value + ' & ' + document.getElementById('downDist').value,
      showDown:  document.getElementById('showDown').value === 'true',
      ticker:    document.getElementById('ticker').value,
    };
  }

  function updateDisplay() {
    const hn = document.getElementById('homeName');
    const an = document.getElementById('awayName');
    const homeName = hn ? (hn.value || 'HOME') : 'HOME';
    const awayName = an ? (an.value || 'AWAY') : 'AWAY';
    document.getElementById('disp-homeName').textContent = homeName;
    document.getElementById('disp-awayName').textContent = awayName;
    const htl = document.getElementById('homeTimeoutLabel'); if(htl) htl.textContent = homeName;
    const atl = document.getElementById('awayTimeoutLabel'); if(atl) atl.textContent = awayName;
    const hs = document.getElementById('homeScore'); if(hs) document.getElementById('disp-homeScore').textContent = hs.value || '0';
    const as_ = document.getElementById('awayScore'); if(as_) document.getElementById('disp-awayScore').textContent = as_.value || '0';
    const p = document.getElementById('period'); if(p) document.getElementById('disp-period').textContent = p.value || '1ST';
    const dn = document.getElementById('downNum'); const dd = document.getElementById('downDist');
    if(dn && dd) document.getElementById('disp-down').textContent = dn.value + ' & ' + dd.value;
    // Update score colors based on team colors
    const hc = document.getElementById('homeColor'); if(hc) document.getElementById('disp-homeScore').style.color = hc.value;
    const ac = document.getElementById('awayColor'); if(ac) document.getElementById('disp-awayScore').style.color = ac.value;
  }

  window.pushUpdate = async function() {
    updateDisplay();
    const btn = document.getElementById('pushBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      await setDoc(scoreRef, getData());
      setStatus(true);
      flashSaved('✓ Overlay Updated', false);
    } catch(e) {
      setStatus(false);
      flashSaved('✗ Save Failed', true);
      console.error(e);
    }
    btn.disabled = false;
    btn.textContent = '⚡ Push to Overlay';
  };

  window.adjustScore = function(team, delta) {
    const id = team === 'home' ? 'homeScore' : 'awayScore';
    const el = document.getElementById(id);
    el.value = Math.max(0, (parseInt(el.value) || 0) + delta);
    window.pushUpdate();
  };

  window.setPeriod = function(val) {
    document.getElementById('period').value = val;
    window.pushUpdate();
  };

  let penaltyActive = false;

  window.setShowDown = async function(show) {
    document.getElementById('showDown').value = show ? 'true' : 'false';
    const dispDown = document.getElementById('disp-down');
    if (dispDown) dispDown.style.display = show ? 'block' : 'none';
    const showBtn = document.getElementById('showDownBtn');
    const hideBtn = document.getElementById('hideDownBtn');
    const activeStyle = 'padding:12px 16px;min-height:52px;width:100%;border-radius:5px;font-family:Barlow Condensed,sans-serif;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:1px;';
    const inactiveStyle = 'padding:12px 16px;min-height:52px;width:100%;border-radius:5px;font-family:Barlow Condensed,sans-serif;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:1px;background:#111;border:1px solid #333;color:#555;';
    if (show) {
      showBtn.style.cssText = activeStyle + 'background:#1a3a1a;border:2px solid #4caf50;color:#4caf50;';
      hideBtn.style.cssText = inactiveStyle;
    } else {
      hideBtn.style.cssText = activeStyle + 'background:#3a0a0a;border:2px solid #c41a1a;color:#c41a1a;';
      showBtn.style.cssText = inactiveStyle;
    }
    // Write directly to Firebase with merge so it doesn't depend on getData timing
    try {
      await setDoc(scoreRef, { showDown: show }, { merge: true });
      flashSaved('✓ Updated', false);
    } catch(e) { console.error(e); }
  };

  window.setFirstAndTen = function() {
    document.getElementById('downNum').value = '1st';
    document.getElementById('downDist').value = '10';
    // Activate 1st down button
    document.querySelectorAll('.down-btn').forEach(b => b.classList.remove('active'));
    const firstBtn = document.querySelector('.down-btn');
    if (firstBtn) firstBtn.classList.add('active');
    // Activate 10 dist button
    document.querySelectorAll('.dist-btn').forEach(b => {
      b.classList.toggle('active', b.textContent.trim() === '10');
    });
    window.pushUpdate();
  };

  window.setQuarter = function(val, btn) {
    document.getElementById('period').value = val;
    document.querySelectorAll('.qtr-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window.pushUpdate();
  };

  window.setDown = function(val, btn) {
    document.getElementById('downNum').value = val;
    document.querySelectorAll('.down-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window.pushUpdate();
  };

  window.setDist = function(val, btn) {
    document.getElementById('downDist').value = val;
    document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window.pushUpdate();
  };

  function setDownDistLocked(locked) {
    const opacity = locked ? '0.3' : '1';
    const pointer = locked ? 'none' : 'auto';
    // Disable all down, dist, reset buttons and show/no show
    document.querySelectorAll('.down-btn, .dist-btn, .reset-down-btn').forEach(b => {
      b.style.opacity = opacity;
      b.style.pointerEvents = pointer;
    });
    const showBtn = document.getElementById('showDownBtn');
    const hideBtn = document.getElementById('hideDownBtn');
    if (showBtn) { showBtn.style.opacity = opacity; showBtn.style.pointerEvents = pointer; }
    if (hideBtn) { hideBtn.style.opacity = opacity; hideBtn.style.pointerEvents = pointer; }
    // Show a lock message when flag is on
    let lockMsg = document.getElementById('downLockMsg');
    if (!lockMsg) {
      lockMsg = document.createElement('div');
      lockMsg.id = 'downLockMsg';
      lockMsg.style.cssText = 'text-align:center;color:#f0c040;font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;padding:6px;background:rgba(240,192,64,0.08);border-radius:4px;margin-bottom:6px;border:1px solid rgba(240,192,64,0.2);';
      lockMsg.textContent = '🚩 FLAG IS ON — Turn flag OFF to change down & distance';
      const gameCard = document.querySelector('.card.gold, [style*="161a20"]');
      if (gameCard) gameCard.insertBefore(lockMsg, gameCard.firstChild);
    }
    lockMsg.style.display = locked ? 'block' : 'none';
  }

  window.togglePenalty = async function() {
    penaltyActive = !penaltyActive;
    const btn = document.getElementById('penaltyBtn');
    if (penaltyActive) {
      btn.style.background = 'linear-gradient(135deg, #f0c040, #c8a000)';
      btn.style.color = '#111';
      btn.style.borderColor = '#fff';
      btn.textContent = '🚩 Flag is ON';
      setDownDistLocked(true);
    } else {
      btn.style.background = 'linear-gradient(135deg, #1a1200, #2a1e00)';
      btn.style.color = '#f0c040';
      btn.style.borderColor = '#f0c040';
      btn.textContent = '🚩 Flag is OFF';
      setDownDistLocked(false);
    }
    try {
      await setDoc(scoreRef, { penalty: penaltyActive }, { merge: true });
    } catch(e) { console.error(e); }
  };

  window.adjustTimeout = function(team, delta) {
    const id = team === 'home' ? 'homeTimeouts' : 'awayTimeouts';
    const el = document.getElementById(id);
    const current = parseInt(el.value);
    el.value = Math.min(3, Math.max(0, (isNaN(current) ? 3 : current) + delta));
    window.pushUpdate();
  };

  window.syncFromOverlay = async function() {
    try {
      const snap = await getDoc(scoreRef);
      if (!snap.exists()) { flashSaved('No overlay data found', true); return; }
      const d = snap.data();
      if (d.homeName) document.getElementById('homeName').value = d.homeName;
      if (d.awayName) document.getElementById('awayName').value = d.awayName;
      if (d.homeScore != null) document.getElementById('homeScore').value = d.homeScore;
      if (d.awayScore != null) document.getElementById('awayScore').value = d.awayScore;
      if (d.homeColor) { document.getElementById('homeColor').value = d.homeColor; document.getElementById('homeColorHex').textContent = d.homeColor; document.getElementById('homeCard').style.borderColor = d.homeColor; document.getElementById('homeCard').style.backgroundColor = d.homeColor + '33'; }
      if (d.awayColor) { document.getElementById('awayColor').value = d.awayColor; document.getElementById('awayColorHex').textContent = d.awayColor; document.getElementById('awayCard').style.borderColor = d.awayColor; document.getElementById('awayCard').style.backgroundColor = d.awayColor + '33'; }
      if (d.period) { document.getElementById('period').value = d.period; document.querySelectorAll('.qtr-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === d.period)); }
      if (d.down) {
        const parts = d.down.split('&');
        if (parts.length === 2) {
          const dn = parts[0].trim(); const dd = parts[1].trim();
          document.getElementById('downNum').value = dn;
          document.getElementById('downDist').value = dd;
          document.querySelectorAll('.down-btn').forEach(b => b.classList.toggle('active', b.textContent.trim().toLowerCase() === dn.toLowerCase()));
          document.querySelectorAll('.dist-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === dd));
        }
      }
      if (d.homeTimeouts != null) document.getElementById('homeTimeouts').value = d.homeTimeouts;
      if (d.awayTimeouts != null) document.getElementById('awayTimeouts').value = d.awayTimeouts;
      if (d.showDown != null) window.setShowDown(d.showDown === true || d.showDown === 'true');
      if (d.ticker) document.getElementById('ticker').value = d.ticker;
      updateDisplay();
      flashSaved('✓ Synced from Overlay', false);
    } catch(e) { flashSaved('✗ Sync Failed', true); console.error(e); }
  };

  window.syncFromOverlay = async function() {
    try {
      const snap = await getDoc(scoreRef);
      if (!snap.exists()) { flashSaved('No overlay data found', true); return; }
      const d = snap.data();
      if (d.homeName) document.getElementById('homeName').value = d.homeName;
      if (d.awayName) document.getElementById('awayName').value = d.awayName;
      if (d.homeScore != null) document.getElementById('homeScore').value = d.homeScore;
      if (d.awayScore != null) document.getElementById('awayScore').value = d.awayScore;
      if (d.homeColor) { document.getElementById('homeColor').value = d.homeColor; document.getElementById('homeColorHex').textContent = d.homeColor; document.getElementById('homeCard').style.borderColor = d.homeColor; document.getElementById('homeCard').style.backgroundColor = d.homeColor + '33'; }
      if (d.awayColor) { document.getElementById('awayColor').value = d.awayColor; document.getElementById('awayColorHex').textContent = d.awayColor; document.getElementById('awayCard').style.borderColor = d.awayColor; document.getElementById('awayCard').style.backgroundColor = d.awayColor + '33'; }
      if (d.period) { document.getElementById('period').value = d.period; document.querySelectorAll('.qtr-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === d.period)); }
      if (d.down) {
        const parts = d.down.split('&');
        if (parts.length === 2) {
          const dn = parts[0].trim(); const dd = parts[1].trim();
          document.getElementById('downNum').value = dn;
          document.getElementById('downDist').value = dd;
          document.querySelectorAll('.down-btn').forEach(b => b.classList.toggle('active', b.textContent.trim().toLowerCase() === dn.toLowerCase()));
          document.querySelectorAll('.dist-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === dd));
        }
      }
      if (d.homeTimeouts != null) document.getElementById('homeTimeouts').value = d.homeTimeouts;
      if (d.awayTimeouts != null) document.getElementById('awayTimeouts').value = d.awayTimeouts;
      if (d.showDown != null) window.setShowDown(d.showDown === true || d.showDown === 'true');
      if (d.ticker) document.getElementById('ticker').value = d.ticker;
      updateDisplay();
      flashSaved('✓ Synced from Overlay', false);
    } catch(e) { flashSaved('✗ Sync Failed', true); console.error(e); }
  };

  window.resetScores = function() {
    if (!confirm('Reset both scores to 0?')) return;
    document.getElementById('homeScore').value = 0;
    document.getElementById('awayScore').value = 0;
    window.pushUpdate();
  };

  function flashSaved(msg, isError) {
    const el = document.getElementById('savedFlash');
    el.textContent = msg;
    el.className = 'saved-flash' + (isError ? ' error-flash' : '');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1800);
  }

  // Auto-push on input change (with small debounce for typing)
  let debounceTimer;
  document.querySelectorAll('input[type="text"], textarea').forEach(el => {
    el.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(window.pushUpdate, 600);
    });
  });

  document.getElementById('downNum').addEventListener('change', window.pushUpdate);
  document.getElementById('homeColor').addEventListener('input', (e) => {
    const hc = e.target.value;
    document.getElementById('homeColorHex').textContent = hc;
    document.getElementById('homeTimeoutLabel').style.color = hc;
    document.getElementById('homeCard').style.borderColor = hc;
    document.getElementById('homeCard').style.backgroundColor = hc + '33';
    document.getElementById('homeTimeouts').style.color = hc;
    window.pushUpdate();
  });
  document.getElementById('awayColor').addEventListener('input', (e) => {
    const ac = e.target.value;
    document.getElementById('awayColorHex').textContent = ac;
    document.getElementById('awayTimeoutLabel').style.color = ac;
    document.getElementById('awayCard').style.borderColor = ac;
    document.getElementById('awayCard').style.backgroundColor = ac + '33';
    document.getElementById('awayTimeouts').style.color = ac;
    window.pushUpdate();
  });
  document.getElementById('downDist').addEventListener('change', window.pushUpdate);

  // Real-time sync display bar FROM Firebase to show what overlay is actually showing
  onSnapshot(doc(db, 'scoreboard', 'live'), (snap) => {
    if (!snap.exists()) return;
    const d = snap.data();
    // Update display bar to reflect live overlay state
    if (d.homeName) document.getElementById('disp-homeName').textContent = d.homeName;
    if (d.awayName) document.getElementById('disp-awayName').textContent = d.awayName;
    if (d.homeScore != null) document.getElementById('disp-homeScore').textContent = d.homeScore;
    if (d.awayScore != null) document.getElementById('disp-awayScore').textContent = d.awayScore;
    if (d.period) document.getElementById('disp-period').textContent = d.period;
    if (d.down) document.getElementById('disp-down').textContent = d.down;
    if (d.homeColor) document.getElementById('disp-homeScore').style.color = d.homeColor;
    if (d.awayColor) document.getElementById('disp-awayScore').style.color = d.awayColor;
    // Show sync indicator
    setStatus(true);
    // Reflect showDown state on buttons and display bar
    if (d.showDown != null) {
      const isShow = d.showDown === true || d.showDown === 'true';
      const dispDown = document.getElementById('disp-down');
      if (dispDown) dispDown.style.display = isShow ? 'block' : 'none';
      const showBtn = document.getElementById('showDownBtn');
      const hideBtn = document.getElementById('hideDownBtn');
      const activeStyle = 'padding:12px 16px;min-height:52px;width:100%;border-radius:5px;font-family:Barlow Condensed,sans-serif;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:1px;';
      const inactiveStyle = 'padding:12px 16px;min-height:52px;width:100%;border-radius:5px;font-family:Barlow Condensed,sans-serif;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:1px;background:#111;border:1px solid #333;color:#555;';
      if (isShow) {
        showBtn.style.cssText = activeStyle + 'background:#1a3a1a;border:2px solid #4caf50;color:#4caf50;';
        hideBtn.style.cssText = inactiveStyle;
      } else {
        hideBtn.style.cssText = activeStyle + 'background:#3a0a0a;border:2px solid #c41a1a;color:#c41a1a;';
        showBtn.style.cssText = inactiveStyle;
      }
      document.getElementById('showDown').value = isShow ? 'true' : 'false';
    }
    // Update display bar timeout pills
    function updateTOPills(containerId, remaining, color) {
      const c = document.getElementById(containerId);
      if (!c) return;
      const pills = c.querySelectorAll('.disp-to-pill');
      pills.forEach((p, i) => {
        p.style.background = color;
        p.style.opacity = i < remaining ? '1' : '0.2';
      });
    }
    if (d.homeTimeouts != null) {
      const hc = document.getElementById('homeColor')?.value || '#1a6fc4';
      updateTOPills('disp-homeTO', d.homeTimeouts, hc);
      document.getElementById('homeTimeouts').value = d.homeTimeouts;
      document.getElementById('homeTimeouts').style.color = hc;
    }
    if (d.awayTimeouts != null) {
      const ac = document.getElementById('awayColor')?.value || '#c41a1a';
      updateTOPills('disp-awayTO', d.awayTimeouts, ac);
      document.getElementById('awayTimeouts').value = d.awayTimeouts;
      document.getElementById('awayTimeouts').style.color = ac;
    }
    // Update team card borders from colors
    if (d.homeColor) {
      const hCard = document.getElementById('homeCard');
      if (hCard) { hCard.style.borderColor = d.homeColor; hCard.style.backgroundColor = d.homeColor + '33'; }
      const htInput = document.getElementById('homeTimeouts');
      if (htInput) htInput.style.color = d.homeColor;
      const htLabel = document.getElementById('homeTimeoutLabel');
      if (htLabel) htLabel.style.color = d.homeColor;
      updateTOPills('disp-homeTO', d.homeTimeouts || 3, d.homeColor);
    }
    if (d.awayColor) {
      const aCard = document.getElementById('awayCard');
      if (aCard) { aCard.style.borderColor = d.awayColor; aCard.style.backgroundColor = d.awayColor + '33'; }
      const atInput = document.getElementById('awayTimeouts');
      if (atInput) atInput.style.color = d.awayColor;
      const atLabel = document.getElementById('awayTimeoutLabel');
      if (atLabel) atLabel.style.color = d.awayColor;
      updateTOPills('disp-awayTO', d.awayTimeouts || 3, d.awayColor);
    }
    // Reflect penalty state
    if (d.penalty != null) {
      penaltyActive = d.penalty;
      const btn = document.getElementById('penaltyBtn');
      if (penaltyActive) {
        btn.style.background = 'linear-gradient(135deg, #f0c040, #c8a000)';
        btn.style.color = '#111'; btn.style.borderColor = '#fff';
        btn.textContent = '🚩 Flag is ON';
        setDownDistLocked(true);
      } else {
        btn.style.background = 'linear-gradient(135deg, #1a1200, #2a1e00)';
        btn.style.color = '#f0c040'; btn.style.borderColor = '#f0c040';
        btn.textContent = '🚩 Flag is OFF';
        setDownDistLocked(false);
      }
    }
  });

  // Load existing state from Firebase on open
  async function loadSaved() {
    try {
      const snap = await getDoc(scoreRef);
      if (snap.exists()) {
        const d = snap.data();
        if (d.homeColor) { document.getElementById('homeColor').value = d.homeColor; document.getElementById('homeColorHex').textContent = d.homeColor; document.getElementById('homeTimeoutLabel').style.color = d.homeColor; }
        if (d.awayColor) { document.getElementById('awayColor').value = d.awayColor; document.getElementById('awayColorHex').textContent = d.awayColor; document.getElementById('awayTimeoutLabel').style.color = d.awayColor; }
        if (d.homeName) document.getElementById('homeName').value = d.homeName;
        if (d.awayName) document.getElementById('awayName').value = d.awayName;
        if (d.homeScore != null) document.getElementById('homeScore').value = d.homeScore;
        if (d.awayScore != null) document.getElementById('awayScore').value = d.awayScore;
        if (d.period) {
          document.getElementById('period').value = d.period;
          document.querySelectorAll('.qtr-btn').forEach(b => {
            b.classList.toggle('active', b.textContent.trim() === d.period);
          });
        }
        if (d.down) {
          const parts = d.down.split('&');
          if (parts.length === 2) {
            const dn = parts[0].trim(); const dd = parts[1].trim();
            document.getElementById('downNum').value = dn;
            document.getElementById('downDist').value = dd;
            document.querySelectorAll('.down-btn').forEach(b => b.classList.toggle('active', b.textContent.trim().toLowerCase() === dn.toLowerCase()));
            document.querySelectorAll('.dist-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === dd));
          }
        }
        if (d.ticker) document.getElementById('ticker').value = d.ticker;
        if (d.showDown != null) {
          window.setShowDown(d.showDown === true || d.showDown === 'true');
        }
        if (d.penalty != null) {
          penaltyActive = d.penalty;
          const btn = document.getElementById('penaltyBtn');
          if (penaltyActive) {
            btn.style.background = 'linear-gradient(135deg, #f0c040, #c8a000)';
            btn.style.color = '#111';
            btn.innerHTML = '<span style="font-size:24px;">🚩</span> FLAG ON FIELD';
          }
        }
      }
      setStatus(true);
    } catch(e) {
      setStatus(false);
      console.error(e);
    }
  }

  loadSaved();
</script>
</body>
</html>
