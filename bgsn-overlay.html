<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BGSN Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Oswald:wght@700&family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
  }

  .scoreboard {
    position: absolute; bottom: 40px;
    left: 288px;
    display: flex; align-items: stretch;
    width: 1344px;
    filter: drop-shadow(0 6px 28px rgba(0,0,0,0.75));
  }
  .timeout-dots {
    position: absolute; bottom: -16px;
    display: flex; gap: 5px; align-items: center;
    z-index: 20;
  }
  .team-block { overflow: visible !important; }
  .team-block.away .timeout-dots { left: 12px; }
  .team-block.home .timeout-dots { right: 12px; }
  .timeout-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .timeout-dot.used {
    background: rgba(255,255,255,0.15);
    box-shadow: none;
  }
  .team-block { display: flex; align-items: center; position: relative; gap: 0; margin: 0; }
  .team-name-pill {
    background: #0d0d0d; color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 25px; letter-spacing: 2px;
    padding: 0 16px;
    height: 30px; align-self: center;
    display: flex; align-items: center; justify-content: center;
    border: none; flex: 1; min-width: 0;
    text-transform: uppercase;
    position: relative; z-index: 1;
    overflow: hidden;
    line-height: 1;
  }
  .team-block.home .team-name-pill {
    border-radius: 0; border-right: none;
    background: linear-gradient(135deg, #0f1923 0%, #162030 100%);
  }
  .team-block.away .team-name-pill {
    border-radius: 0; border-left: none;
    background: linear-gradient(135deg, #1a100f 0%, #210e0d 100%);
  }
  .team-name-pill::before, .score-box::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.32) 0%,
      rgba(255,255,255,0.16) 40%,
      rgba(0,0,0,0.0) 50%,
      rgba(0,0,0,0.20) 100%);
    pointer-events: none; z-index: 3;
  }
  .score-box {
    width: 81px; height: 52px; padding: 0; display: flex; align-items: center; justify-content: center;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 33px; color: #fff; position: relative; z-index: 2;
    letter-spacing: -1px; border: none; margin: 0;
  }
  .score-box.bump { animation: scoreBump 0.3s ease; }
  @keyframes scoreBump { 0%{transform:scale(1);} 50%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .team-block.home .score-box {
    background: linear-gradient(180deg, #1a6fc4 0%, #0d4a8a 100%);
  }
  .team-block.away .score-box {
    background: linear-gradient(180deg, #c41a1a 0%, #8a0d0d 100%);
  }

  .center-block {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, #1a1a2e 0%, #0d0d1a 60%, #111 100%);
    border: 1px solid #c8a84b44; width: 148px; height: 52px;
    position: relative; z-index: 3; gap: 1px; overflow: hidden;
    box-shadow: inset 0 0 20px rgba(200,168,75,0.08);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 18%, black 82%, transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0%, black 18%, black 82%, transparent 100%);
  }

  .center-block::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 12px;
    background: linear-gradient(90deg, var(--away-color, #c41a1a), #fff 50%, var(--home-color, #1a6fc4));
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 40%, black 100%);
    mask-image: linear-gradient(180deg, transparent 0%, black 40%, black 100%);
  }
  .bgsn-text {
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 24px; letter-spacing: 1px;
    color: #fff;
    text-shadow:
      -1px -1px 0 #c8a84b,
       1px -1px 0 #c8a84b,
      -1px  1px 0 #c8a84b,
       1px  1px 0 #c8a84b,
      -2px  0   0 #a07830,
       2px  0   0 #a07830,
       0   -2px 0 #f0d080,
       0    2px 0 #a07830,
       0    3px 5px rgba(0,0,0,0.9);
    line-height: 1; text-transform: uppercase;
    position: relative; z-index: 1;
    -webkit-background-clip: unset; background-clip: unset;
    background: none;
  }


  .info-bar {
    position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: row; align-items: stretch; gap: 0;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.6));
    white-space: nowrap;
  }
  .info-pill {
    background: rgba(10,10,10,0.92); border: 1px solid #2a2a2a; color: #ccc;
    font-weight: 700; font-size: 15px; letter-spacing: 2px;
    padding: 5px 18px; text-transform: uppercase;
  }
  .info-pill.period {
    border-radius: 4px 0 0 4px;
    color: #f0c040; font-family: 'Oswald', sans-serif; font-size: 25px; padding: 0 18px;
    border-right: none;
  }

  .info-pill.down {
    border-radius: 0 4px 4px 0; font-size: 25px;
    color: #fff; font-family: 'Oswald', sans-serif; padding: 0 18px;
    transition: opacity 0.3s, max-width 0.3s;
  }
  .info-pill.down.hidden {
    opacity: 0; pointer-events: none; max-width: 0; padding: 0; overflow: hidden; border: none;
  }

  .penalty-flag {
    position: absolute;
    bottom: 132px;
    left: 50%;
    transform: translateX(-50%);
    background: #f0c040;
    color: #111;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; letter-spacing: 5px;
    padding: 8px 30px;
    border-radius: 4px;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.6));
    transition: opacity 0.3s;
    z-index: 10;
    white-space: nowrap;
  }
  .penalty-flag.hidden { opacity: 0; pointer-events: none; }
  .ticker {
    position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
    background: linear-gradient(90deg, #0d0d0d, #111);
    border-top: 2px solid #222; display: flex; align-items: center; overflow: hidden;
  }
  .ticker-content {
    flex: 1; overflow: hidden; display: flex; align-items: center; height: 100%;
  }
  .ticker-label {
    background: #0a1628; color: #c8a84b;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: 2px; padding: 0 18px; height: 100%;
    display: flex; align-items: center; white-space: nowrap;
    flex-shrink: 0; border-right: 3px solid #c8a84b;
    text-shadow: 0 0 8px rgba(200,168,75,0.4);
  }
  .ticker-scroll {
    display: flex; white-space: nowrap;
  }
  .ticker-item {
    color: #ddd; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 34px; letter-spacing: 1px; padding: 0 30px; line-height: 40px;
  }
  .ticker-item span { color: #f0c040; font-weight: 900; }
  .ticker-sep { color: #444; padding: 0 8px; font-size: 34px; line-height: 40px; }
  @keyframes scroll-left { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }
</style>
</head>
<body>


<div class="scoreboard">
  <div class="team-block away">
    <div class="team-name-pill" id="awayName">AWAY</div>
    <div class="score-box" id="awayScore">0</div>
    <div class="timeout-dots" id="awayTimeouts">
      <div class="timeout-dot"></div>
      <div class="timeout-dot"></div>
      <div class="timeout-dot"></div>
    </div>
  </div>
  <div class="center-block">
    <div class="bgsn-text">BGSN</div>
  </div>
  <div class="team-block home">
    <div class="score-box" id="homeScore">0</div>
    <div class="team-name-pill" id="homeName">HOME</div>
    <div class="timeout-dots" id="homeTimeouts">
      <div class="timeout-dot"></div>
      <div class="timeout-dot"></div>
      <div class="timeout-dot"></div>
    </div>
  </div>
</div>

<div class="info-bar">
  <div class="info-pill period" id="period">1ST</div>
  <div class="info-pill down" id="down">1st &amp; 10</div>
</div>

<div class="penalty-flag hidden" id="penaltyFlag">FLAG</div>

<div class="ticker">
  <div class="ticker-label">BGSN</div>
  <div class="ticker-content">
  <div class="ticker-scroll" id="tickerScroll">
    <span class="ticker-item">Welcome to <span>BGSN Sports Network</span></span>
    <span class="ticker-sep">◆</span>
    <span class="ticker-item">Follow us for live coverage <span>every game day</span></span>
    <span class="ticker-sep">◆</span>
    <span class="ticker-item">Welcome to <span>BGSN Sports Network</span></span>
    <span class="ticker-sep">◆</span>
    <span class="ticker-item">Follow us for live coverage <span>every game day</span></span>
    <span class="ticker-sep">◆</span>
  </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyABNKTrQKTiw4U78JGDFAw9eZDZM-3gK2s",
    authDomain: "bgsn-scoreboard.firebaseapp.com",
    projectId: "bgsn-scoreboard",
    storageBucket: "bgsn-scoreboard.firebasestorage.app",
    messagingSenderId: "888144845710",
    appId: "1:888144845710:web:fe848d883391be787622df"
  });
  const db = getFirestore(app);

  let prevHome = null, prevAway = null;

  // Set constant ticker speed on initial load
  function initTickerSpeed() {
    const el = document.getElementById('tickerScroll');
    if (!el) return;
    requestAnimationFrame(() => {
      const width = el.scrollWidth / 2;
      if (width > 0) {
        const duration = width / 120;
        el.style.animation = `scroll-left ${duration}s linear infinite`;
      }
    });
  }
  window.addEventListener('load', initTickerSpeed);

  function bump(id) {
    const el = document.getElementById(id);
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  onSnapshot(doc(db, 'scoreboard', 'live'), (snap) => {
    if (!snap.exists()) return;
    const d = snap.data();

    const set = (id, val) => { if (val != null) document.getElementById(id).textContent = val; };
    set('homeName', d.homeName);
    set('awayName', d.awayName);
    set('period', d.period);
    set('down', d.down);

    if (d.homeScore != null && String(d.homeScore) !== prevHome) {
      set('homeScore', d.homeScore);
      if (prevHome !== null) bump('homeScore');
      prevHome = String(d.homeScore);
    }
    if (d.awayScore != null && String(d.awayScore) !== prevAway) {
      set('awayScore', d.awayScore);
      if (prevAway !== null) bump('awayScore');
      prevAway = String(d.awayScore);
    }

    if (d.ticker) {
      const items = d.ticker.split('|').map(t => t.trim()).filter(Boolean);
      const doubled = [...items, ...items];
      const el = document.getElementById('tickerScroll');
      el.innerHTML = doubled
        .map(t => `<span class="ticker-item">${t}</span><span class="ticker-sep">◆</span>`)
        .join('');
      // Set speed after content renders: 120px per second constant speed
      requestAnimationFrame(() => {
        const width = el.scrollWidth / 2;
        const duration = width / 120;
        el.style.animation = `scroll-left ${duration}s linear infinite`;
      });
    }

    const flag = document.getElementById('penaltyFlag');
    if (flag) flag.classList.toggle('hidden', !d.penalty);

    // Update timeout dots
    function updateDots(id, remaining) {
      const container = document.getElementById(id);
      if (!container) return;
      const dots = container.querySelectorAll('.timeout-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('used', i >= remaining);
      });
    }
    if (d.homeTimeouts != null) updateDots('homeTimeouts', d.homeTimeouts);
    if (d.awayTimeouts != null) updateDots('awayTimeouts', d.awayTimeouts);

    // Toggle down & distance visibility
    const downEl = document.getElementById('down');
    if (downEl) downEl.classList.toggle('hidden', d.showDown === false || d.showDown === 'false');

    // Team colors
    if (d.homeColor) {
      const hc = d.homeColor;
      const hcDark = hc + 'cc';
      document.querySelector(':root').style.setProperty('--home-color', hc);
      document.querySelector('.team-block.home .score-box').style.background = `linear-gradient(180deg, ${hc} 0%, ${hcDark} 100%)`;
      document.querySelector('.team-block.home .team-name-pill').style.background = `${hc}`;
    }
    if (d.awayColor) {
      const ac = d.awayColor;
      const acDark = ac + 'cc';
      document.querySelector(':root').style.setProperty('--away-color', ac);
      document.querySelector('.team-block.away .score-box').style.background = `linear-gradient(180deg, ${ac} 0%, ${acDark} 100%)`;
      document.querySelector('.team-block.away .team-name-pill').style.background = `${ac}`;
    }
  });
</script>
</body>
</html>
