<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BGSN Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Oswald:wght@700&family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
  }

  .scoreboard {
    position: absolute; bottom: 50px;
    left: 200px;
    display: flex; align-items: stretch;
    filter: drop-shadow(0 6px 28px rgba(0,0,0,0.75));
  }
  .timeout-dots {
    display: flex; gap: 4px; align-items: center;
    justify-content: center;
    position: absolute;
    bottom: 4px;
    left: 50%; transform: translateX(-50%);
    z-index: 20;
  }
  .timeout-dot {
    width: 36px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 5px rgba(255,255,255,0.6);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .timeout-dot.used {
    background: rgba(255,255,255,0.25);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .team-block { display: flex; align-items: center; position: relative; gap: 0; margin: 0; }
  .team-name-pill {
    background: #0d0d0d; color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 50px; letter-spacing: 2px;
    padding: 0 16px;
    height: 60px; align-self: center;
    width: 450px; min-width: 450px; max-width: 450px;
    display: flex; align-items: center; justify-content: center;
    border: none;
    text-transform: uppercase;
    position: relative; z-index: 1;
    overflow: hidden;
    line-height: 1;
  }
  .team-block.home .team-name-pill {
    border-radius: 0 8px 8px 0; border-right: none;
    background: linear-gradient(90deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(90deg, black 0%, black 70%, rgba(0,0,0,0.5) 87%, transparent 100%);
    mask-image: linear-gradient(90deg, black 0%, black 70%, rgba(0,0,0,0.5) 87%, transparent 100%);
  }
  .team-block.away .team-name-pill {
    border-radius: 8px 0 0 8px; border-left: none;
    background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.5) 13%, black 30%, black 100%);
    mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.5) 13%, black 30%, black 100%);
  }
  .team-name-pill::before, .score-box::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.75) 0%,
      rgba(255,255,255,0.45) 8%,
      rgba(255,255,255,0.15) 22%,
      rgba(255,255,255,0.03) 38%,
      rgba(0,0,0,0.0) 50%,
      rgba(0,0,0,0.18) 78%,
      rgba(0,0,0,0.35) 100%);
    pointer-events: none; z-index: 3;
  }
  .score-box {
    width: 162px; height: 60px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; position: relative;
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 46px; color: #fff; z-index: 2;
    letter-spacing: -1px; border: none; margin: 0;
  }
  .score-box.bump { animation: scoreBump 0.3s ease; }
  @keyframes scoreBump { 0%{transform:scale(1);} 50%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .team-block.home .score-box {
    background: linear-gradient(180deg, #1a6fc4 0%, #0d4a8a 100%);
    border-radius: 0;
  }
  .team-block.away .score-box {
    background: linear-gradient(180deg, #c41a1a 0%, #8a0d0d 100%);
    border-radius: 0;
  }
  .team-block.away .score-box::after {
    content: ''; position: absolute; top: 0; right: -18px; width: 18px; height: 100%;
    background: linear-gradient(90deg, var(--away-glow, rgba(196,26,26,0.5)), transparent);
    pointer-events: none; z-index: 4;
  }
  .team-block.home .score-box::after {
    content: ''; position: absolute; top: 0; left: -18px; width: 18px; height: 100%;
    background: linear-gradient(90deg, transparent, var(--home-glow, rgba(26,111,196,0.5)));
    pointer-events: none; z-index: 4;
  }

  .center-block {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, #1a1a2e 0%, #0d0d1a 60%, #111 100%);
    border: 1px solid #c8a84b44; width: 296px; height: 60px;
    position: relative; z-index: 3; gap: 1px; overflow: hidden;
    box-shadow: inset 0 0 20px rgba(200,168,75,0.08);
  }





  .info-bar {
    position: absolute; bottom: 154px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.6));
    white-space: nowrap;
  }
  .info-pill {
    background: rgba(10,10,10,0.92); border: 1px solid #2a2a2a; color: #ccc;
    font-weight: 700; font-size: 15px; letter-spacing: 2px;
    padding: 5px 18px; text-transform: uppercase;
  }

  .info-pill.down {
    border-radius: 4px 4px 0 0; font-size: 38px;
    color: #fff; font-family: 'Oswald', sans-serif; padding: 0 20px;
    transition: opacity 0.3s, max-height 0.3s;
  }
  .info-pill.down.hidden {
    opacity: 0; pointer-events: none; max-height: 0; padding: 0; overflow: hidden; border: none;
  }

  .penalty-flag {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #ffe44d 0%, #f0c040 100%);
    color: #111;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px; letter-spacing: 5px;
    width: 296px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    box-shadow: 0 0 20px #f0c040, 0 0 40px rgba(240,192,64,0.6);
    filter: drop-shadow(0 0 12px rgba(240,192,64,0.9));
    transition: opacity 0.4s;
    z-index: 10;
    white-space: nowrap;
  }
  .penalty-flag.hidden { opacity: 0; pointer-events: none; }

  /* Yellow glow cloud across top of scoreboard when flag shown */
  .flag-glow {
    position: absolute;
    bottom: 108px;
    left: 200px;
    width: 1520px;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(240,192,64,0.45) 0%, rgba(240,192,64,0.15) 50%, transparent 100%);
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .flag-glow.visible { opacity: 1; }
  .ticker {
    position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
    background: linear-gradient(90deg, #0d0d0d, #111);
    border-top: 2px solid #222; display: flex; align-items: center; overflow: hidden;
  }
  .ticker-content {
    flex: 1; overflow: hidden; display: flex; align-items: center; height: 100%;
  }
  .ticker-label {
    background: #0a1628; color: #c8a84b;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: 2px; padding: 0 18px; height: 100%;
    display: flex; align-items: center; white-space: nowrap;
    flex-shrink: 0; border-right: 3px solid #c8a84b;
    text-shadow: 0 0 8px rgba(200,168,75,0.4);
  }
  .ticker-scroll {
    display: flex; white-space: nowrap;
  }
  .ticker-item {
    color: #ddd; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 34px; letter-spacing: 1px; padding: 0 30px; line-height: 40px;
  }
  .ticker-item span { color: #f0c040; font-weight: 900; }
  .ticker-sep { color: #444; padding: 0 8px; font-size: 34px; line-height: 40px; }
  @keyframes scroll-left { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }
</style>
</head>
<body>


<div class="scoreboard">
  <div class="team-block away">
    <div class="team-name-pill" id="awayName">AWAY</div>
    <div class="score-box">
      <span id="awayScore" style="margin-top:2px;line-height:1;">0</span>
      <div class="timeout-dots" id="awayTimeouts">
        <div class="timeout-dot"></div>
        <div class="timeout-dot"></div>
        <div class="timeout-dot"></div>
      </div>
    </div>
  </div>
  <div class="center-block">
    <div id="period" style="font-family:'Oswald',sans-serif;font-weight:700;font-size:38px;color:#f0c040;letter-spacing:2px;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,0.8);position:relative;z-index:2;">1ST</div>
  </div>
  <div class="team-block home">
    <div class="score-box">
      <span id="homeScore" style="margin-top:2px;line-height:1;">0</span>
      <div class="timeout-dots" id="homeTimeouts">
        <div class="timeout-dot"></div>
        <div class="timeout-dot"></div>
        <div class="timeout-dot"></div>
      </div>
    </div>
    <div class="team-name-pill" id="homeName">HOME</div>
  </div>
</div>

<div class="info-bar">
  <div class="info-pill down" id="down">1st &amp; 10</div>
</div>

<div class="flag-glow" id="flagGlow"></div>
<div class="penalty-flag hidden" id="penaltyFlag">FLAG</div>

<div class="ticker">
  <div class="ticker-label">BGSN</div>
  <div class="ticker-content">
  <div class="ticker-scroll" id="tickerScroll">
    <span class="ticker-item">Welcome to <span>BGSN Sports Network</span></span>
    <span class="ticker-sep">◆</span>
    <span class="ticker-item">Follow us for live coverage <span>every game day</span></span>
    <span class="ticker-sep">◆</span>
    <span class="ticker-item">Welcome to <span>BGSN Sports Network</span></span>
    <span class="ticker-sep">◆</span>
    <span class="ticker-item">Follow us for live coverage <span>every game day</span></span>
    <span class="ticker-sep">◆</span>
  </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyABNKTrQKTiw4U78JGDFAw9eZDZM-3gK2s",
    authDomain: "bgsn-scoreboard.firebaseapp.com",
    projectId: "bgsn-scoreboard",
    storageBucket: "bgsn-scoreboard.firebasestorage.app",
    messagingSenderId: "888144845710",
    appId: "1:888144845710:web:fe848d883391be787622df"
  });
  const db = getFirestore(app);

  let prevHome = null, prevAway = null;

  // Initialize dots to full (3) before Firebase loads
  function initDots() {
    ['homeTimeouts','awayTimeouts'].forEach(id => {
      const container = document.getElementById(id);
      if (!container) return;
      container.querySelectorAll('.timeout-dot').forEach(d => d.classList.remove('used'));
    });
  }
  initDots();

  // Set constant ticker speed on initial load
  function initTickerSpeed() {
    const el = document.getElementById('tickerScroll');
    if (!el) return;
    requestAnimationFrame(() => {
      const width = el.scrollWidth / 2;
      if (width > 0) {
        const duration = width / 120;
        el.style.animation = `scroll-left ${duration}s linear infinite`;
      }
    });
  }
  window.addEventListener('load', initTickerSpeed);

  function bump(id) {
    const el = document.getElementById(id);
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  onSnapshot(doc(db, 'scoreboard', 'live'), (snap) => {
    if (!snap.exists()) return;
    const d = snap.data();

    const set = (id, val) => { if (val != null) document.getElementById(id).textContent = val; };
    set('homeName', d.homeName);
    set('awayName', d.awayName);
    if (d.period != null) { document.getElementById('period').textContent = d.period; }
    set('down', d.down);

    if (d.homeScore != null && String(d.homeScore) !== prevHome) {
      set('homeScore', d.homeScore);
      if (prevHome !== null) bump('homeScore');
      prevHome = String(d.homeScore);
    }
    if (d.awayScore != null && String(d.awayScore) !== prevAway) {
      set('awayScore', d.awayScore);
      if (prevAway !== null) bump('awayScore');
      prevAway = String(d.awayScore);
    }

    if (d.ticker) {
      const items = d.ticker.split('|').map(t => t.trim()).filter(Boolean);
      const doubled = [...items, ...items];
      const el = document.getElementById('tickerScroll');
      el.innerHTML = doubled
        .map(t => `<span class="ticker-item">${t}</span><span class="ticker-sep">◆</span>`)
        .join('');
      // Set speed after content renders: 120px per second constant speed
      requestAnimationFrame(() => {
        const width = el.scrollWidth / 2;
        const duration = width / 120;
        el.style.animation = `scroll-left ${duration}s linear infinite`;
      });
    }

    const flag = document.getElementById('penaltyFlag');
    const glow = document.getElementById('flagGlow');
    const downEl = document.getElementById('down');
    const penaltyOn = !!d.penalty;
    if (flag) flag.classList.toggle('hidden', !penaltyOn);
    if (glow) glow.classList.toggle('visible', penaltyOn);
    // 5. Hide down & distance when flag is on, show when off
    if (downEl) {
      if (penaltyOn) {
        downEl.classList.add('hidden');
      } else {
        if (d.showDown !== false && d.showDown !== 'false') downEl.classList.remove('hidden');
      }
    }

    // Update timeout dots
    function updateDots(id, remaining) {
      const container = document.getElementById(id);
      if (!container) return;
      const dots = container.querySelectorAll('.timeout-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('used', i >= remaining);
      });
    }
    if (d.homeTimeouts != null) updateDots('homeTimeouts', d.homeTimeouts);
    if (d.awayTimeouts != null) updateDots('awayTimeouts', d.awayTimeouts);


    // Team colors
    if (d.homeColor) {
      const hc = d.homeColor;
      const hcDark = hc + 'cc';
      document.querySelector(':root').style.setProperty('--home-color', hc);
      document.querySelector('.team-block.home .score-box').style.background = `linear-gradient(180deg, ${hc} 0%, ${hcDark} 100%)`;
      document.querySelector('.team-block.home .score-box').style.borderRadius = '0';
      document.querySelector(':root').style.setProperty('--home-glow', `${hc}88`);
      // Name pill blends into score box using same color base
      document.querySelector('.team-block.home .team-name-pill').style.background = `linear-gradient(90deg, ${hc}88 0%, ${hc}ff 100%)`;
    }
    if (d.awayColor) {
      const ac = d.awayColor;
      const acDark = ac + 'cc';
      document.querySelector(':root').style.setProperty('--away-color', ac);
      document.querySelector('.team-block.away .score-box').style.background = `linear-gradient(180deg, ${ac} 0%, ${acDark} 100%)`;
      document.querySelector('.team-block.away .score-box').style.borderRadius = '0';
      document.querySelector(':root').style.setProperty('--away-glow', `${ac}88`);
      // Name pill blends into score box using same color base
      document.querySelector('.team-block.away .team-name-pill').style.background = `linear-gradient(90deg, ${ac}ff 0%, ${ac}88 100%)`;
    }
  });
</script>
</body>
</html>
